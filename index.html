<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1d1b3a">
<title>Doodle Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
  /* Layout: one fixed full-screen column per screen; the sketch pad takes all spare height. */
  :root {
    --bg: #1d1b3a;
    --bg-2: #2a2752;
    --paper: #fffdf6;
    --ink: #1f1d36;
    --text: #f4f1ff;
    --muted: #a9a4d4;
    --pop: #ffd23f;
    --bad: #ff6f9c;
    --good: #3ddbd9;
    --font: "Fredoka", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
  body { overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }

  #app {
    position: fixed; left: 0; top: 0; width: 100%;
    height: var(--vvh, 100dvh);
    padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    display: flex; justify-content: center;
  }
  .screen { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }

  h1 { margin: 0; font-size: clamp(40px, 13vw, 60px); line-height: .92; font-weight: 700; letter-spacing: -.01em; }
  h1 span { color: var(--pop); }
  .tag { margin: 0; color: var(--muted); font-size: 17px; }

  label, .label { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  input {
    font: inherit; font-size: 18px; width: 100%; min-width: 0;
    padding: 12px 14px; border-radius: 14px; border: 2px solid transparent;
    background: var(--bg-2); color: var(--text); outline: none;
  }
  input:focus { border-color: var(--pop); }
  input::placeholder { color: var(--muted); }

  button {
    font: inherit; font-weight: 600; font-size: 19px; cursor: pointer;
    padding: 14px 18px; border: 0; border-radius: 16px;
    background: var(--pop); color: var(--ink);
    box-shadow: 0 4px 0 #c79a0e; transition: transform .06s, box-shadow .06s;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #c79a0e; }
  button:disabled { background: var(--bg-2); color: var(--muted); box-shadow: none; cursor: default; transform: none; }
  button.ghost { background: transparent; color: var(--text); box-shadow: none; border: 2px solid var(--bg-2); font-size: 16px; padding: 10px 14px; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--pop); outline-offset: 2px; }

  /* Lobby: scrolls on short screens; auto margins centre it without clipping the top. */
  #lobby { overflow-y: auto; gap: 12px; }
  #lobby > :first-child { margin-top: auto; }
  #lobby > :last-child { margin-bottom: auto; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  #hostBox { display: flex; flex-direction: column; align-items: center; gap: 10px; background: var(--bg-2); border-radius: 22px; padding: 16px; }
  #qr { background: #fff; padding: 10px; border-radius: 14px; line-height: 0; min-height: 190px; min-width: 190px; }
  #qr img, #qr canvas { width: 170px; height: 170px; }
  #codeLine { margin: 0; color: var(--muted); }
  #codeLine b { color: var(--text); letter-spacing: .2em; font-size: 20px; }
  #status { margin: 0; min-height: 1.4em; font-size: 17px; text-align: center; }
  #status.ok { color: var(--good); }
  #status.bad { color: var(--bad); }
  #whoBox, #modeBox { display: flex; flex-direction: column; gap: 6px; }
  #modeNote { margin: 0; text-align: center; color: var(--muted); }
  #modeNote b { color: var(--text); }

  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg button {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left;
    background: var(--bg-2); color: var(--text); box-shadow: none; border: 2px solid transparent; font-size: 17px; padding: 10px 12px;
  }
  .seg button small { font-weight: 400; font-size: 13px; color: var(--muted); }
  .seg button.on { border-color: var(--pop); }
  .seg button:active { transform: none; }

  /* Player chips (lobby list and in-game scoreboard) */
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; flex: none; }
  .chips.scroll::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 11px 5px 8px; border-radius: 999px; background: var(--bg-2);
    border: 2px solid transparent; font-size: 15px; white-space: nowrap;
  }
  .chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
  .chip b { font-variant-numeric: tabular-nums; color: var(--c); }
  .chip.me { border-color: var(--c); }
  .chip.off { opacity: .45; }
  .chip.got { background: color-mix(in srgb, var(--good) 22%, var(--bg-2)); }
  .chip.bump b { animation: bump .5s; }
  @keyframes bump { 40% { transform: scale(1.6); } }

  /* Game */
  .hudtop { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
  .hudtop span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hudtop span:last-child { flex: none; }
  .timer { height: 8px; border-radius: 8px; background: var(--bg-2); overflow: hidden; flex: none; }
  .timer i { display: block; height: 100%; width: 100%; background: var(--pop); transform-origin: left; }
  .timer.low i { background: var(--bad); }
  #hint { flex: none; text-align: center; font-size: 22px; font-weight: 600; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hint small { font-size: 14px; color: var(--muted); font-weight: 400; letter-spacing: 0; }

  .board { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; }
  canvas { background: var(--paper); border-radius: 20px; box-shadow: 0 6px 0 rgba(0,0,0,.25); display: block; }
  canvas.pen { touch-action: none; cursor: crosshair; }
  #banner, #count {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none;
  }
  #banner { justify-content: flex-end; padding-bottom: 6%; }
  #banner .word { background: var(--ink); color: var(--pop); font-size: clamp(24px, 8vw, 38px); font-weight: 700; padding: 6px 18px; border-radius: 14px; text-transform: capitalize; }
  #banner .who { margin: 6px 12px 0; background: var(--ink); color: var(--c, var(--text)); padding: 4px 12px; border-radius: 10px; font-size: 16px; }
  #count { font-size: 120px; font-weight: 700; color: var(--pop); text-shadow: 0 6px 0 rgba(0,0,0,.3); }
  #choose {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: rgba(29, 27, 58, .9); border-radius: 20px; padding: 16px; text-align: center;
  }
  #chooseTitle { margin: 0; font-size: 22px; font-weight: 600; text-wrap: balance; }
  #chooseBtns { display: flex; flex-direction: column; gap: 10px; width: min(260px, 100%); }
  #chooseBtns button { text-transform: capitalize; }

  #feed { height: 58px; flex: none; display: flex; flex-direction: column; justify-content: flex-end; font-size: 14px; color: var(--muted); text-align: center; }
  #feed div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #feed .good { color: var(--good); font-weight: 600; }
  #feed .close { color: var(--pop); font-weight: 600; }
  #guessForm { display: flex; gap: 8px; flex: none; }
  #guessForm input { flex: 1; background: var(--paper); color: var(--ink); }
  #guessForm input::placeholder { color: #8d89a8; }
  #guessForm input:disabled { opacity: .55; }
  #guessForm button { flex: none; }

  #tools { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; flex: none; }
  #tools button { box-shadow: none; padding: 0; }
  #tools button:active { transform: scale(.92); }
  .sw { width: 32px; height: 32px; border-radius: 50%; background: var(--c); border: 3px solid var(--bg-2); }
  .sw.eraser { background: linear-gradient(135deg, var(--paper) 44%, var(--bad) 44% 56%, var(--paper) 56%); }
  .sw.on { border-color: var(--pop); }
  .sz { width: 38px; height: 32px; border-radius: 10px; background: var(--bg-2); display: grid; place-items: center; border: 2px solid transparent; }
  .sz i { display: block; width: var(--d); height: var(--d); border-radius: 50%; background: var(--text); }
  .sz.on { border-color: var(--pop); }
  .tbtn { font-size: 15px !important; padding: 6px 12px !important; border-radius: 10px; background: var(--bg-2); color: var(--text); }

  /* End */
  #end { justify-content: center; text-align: center; gap: 18px; overflow-y: auto; }
  #endTitle { font-size: clamp(36px, 11vw, 54px); font-weight: 700; margin: 0; line-height: 1.02; text-wrap: balance; }
  #rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; text-align: left; }
  #rank li { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; background: var(--bg-2); border-radius: 14px; padding: 10px 14px; border: 2px solid transparent; }
  #rank li.me { border-color: var(--c); }
  #rank .pos { color: var(--muted); font-variant-numeric: tabular-nums; }
  #rank .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #rank .sc { font-size: 26px; font-weight: 700; color: var(--c); font-variant-numeric: tabular-nums; }
  #rank li:first-child .sc { font-size: 32px; }
  #endNote { margin: 0; color: var(--muted); }

  /* Picture check sheet (?sheet) */
  #sheet { position: fixed; inset: 0; overflow: auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; background: var(--bg); }
  #sheet figure { margin: 0; text-align: center; font-size: 14px; }
  #sheet canvas { width: 100%; height: auto; border-radius: 12px; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main id="app">

  <section id="lobby" class="screen">
    <h1>Doodle<br><span>Duel</span></h1>
    <p class="tag">Guess the robot's scribbles, or take turns drawing for each other. Faster guesses score more.</p>
    <div class="field">
      <label for="name">Your name</label>
      <input id="name" maxlength="12" autocomplete="off" placeholder="Type your name">
    </div>
    <div id="hostBox" hidden>
      <div id="qr"></div>
      <p id="codeLine">Room <b id="code"></b></p>
      <button id="share" class="ghost" type="button">Send the link instead</button>
    </div>
    <div id="modeBox" hidden>
      <span class="label">Game mode</span>
      <div class="seg">
        <button type="button" id="modeRobot" class="on">Robot draws<small>Guess its tough scribbles</small></button>
        <button type="button" id="modeDraw">You draw<small>Take turns drawing</small></button>
      </div>
    </div>
    <p id="modeNote" hidden></p>
    <div id="whoBox" hidden>
      <span class="label" id="whoLabel">Players</span>
      <div class="chips" id="who"></div>
    </div>
    <p id="status" role="status">Setting up…</p>
    <button id="start" type="button" disabled hidden>Start game</button>
    <button id="retry" type="button" hidden>Try again</button>
  </section>

  <section id="game" class="screen" hidden>
    <div class="hudtop"><span id="roundNo"></span><span id="roomTag"></span></div>
    <div class="chips scroll" id="board-chips"></div>
    <div class="timer" id="timer"><i id="bar"></i></div>
    <div id="hint" hidden></div>
    <div class="board" id="board">
      <canvas id="cv" width="300" height="300" aria-label="The drawing"></canvas>
      <div id="banner" hidden><div class="word" id="bWord"></div><div class="who" id="bWho"></div></div>
      <div id="count" hidden></div>
      <div id="choose" hidden><p id="chooseTitle"></p><div id="chooseBtns"></div></div>
    </div>
    <div id="feed" aria-live="polite"></div>
    <form id="guessForm" autocomplete="off">
      <input id="guess" placeholder="What is it?" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" maxlength="24" aria-label="Your guess">
      <button type="submit">Guess</button>
    </form>
    <div id="tools" hidden></div>
  </section>

  <section id="end" class="screen" hidden>
    <p id="endTitle"></p>
    <ol id="rank"></ol>
    <p id="endNote"></p>
    <button id="again" type="button" hidden>Play again</button>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(() => {
  'use strict';

  // ---------- settings ----------
  const TOTAL = 20;            // pictures per robot game
  const ROUND_MS = 14000;      // robot mode: time to guess each picture
  const DRAW_MS = 4000;        // robot mode: the robot finishes each drawing in 4 seconds
  const TURN_MS = 80000;       // draw mode: time for each drawing turn
  const CHOOSE_MS = 12000;     // draw mode: time to pick a word
  const REVEAL_MS = 3500;      // pause on the answer
  const POINTS = [3, 2];       // 1st correct guess 3, 2nd 2, everyone after 1
  const PREFIX = 'doodleduel-v4-';
  // Supabase Realtime relays messages between phones (publishable key: safe to ship in the page).
  const SB_URL = 'https://popmeskdinlnlikzylyt.supabase.co';
  const SB_KEY = 'sb_publishable_7LN22XE2uyl7vjv_nKglow_Uw6-rTWN';
  const COLORS = ['#3ddbd9', '#ff6f9c', '#ffd23f', '#a99bff', '#7ee081', '#ff9f45', '#5cb8ff', '#f78fe0'];

  // ---------- drawing helpers (100 x 100 grid, y goes down) ----------
  const P = (...n) => { const o = []; for (let i = 0; i < n.length; i += 2) o.push([n[i], n[i + 1]]); return o; };
  const A = (cx, cy, rx, ry = rx, a0 = 0, a1 = 360) => {
    const n = Math.max(8, Math.ceil(Math.abs(a1 - a0) / 12)), o = [];
    for (let i = 0; i <= n; i++) { const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180; o.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]); }
    return o;
  };
  const B = (x0, y0, x1, y1, x2, y2, x3, y3) => Array.from({ length: 17 }, (_, i) => {
    const t = i / 16, u = 1 - t;
    return [u * u * u * x0 + 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t * x3, u * u * u * y0 + 3 * u * u * t * y1 + 3 * u * t * t * y2 + t * t * t * y3];
  });
  const SP = (cx, cy, r, turns, a0 = 90) => {
    const n = Math.ceil(turns * 30);
    return Array.from({ length: n + 1 }, (_, i) => {
      const t = i / n, a = (a0 + t * turns * 360) * Math.PI / 180, rr = r * (1 - t * 0.9);
      return [cx + rr * Math.cos(a), cy + rr * Math.sin(a)];
    });
  };
  const rays = (cx, cy, r0, r1, n, off = 0) => Array.from({ length: n }, (_, i) => {
    const a = (off + 360 * i / n) * Math.PI / 180;
    return [[cx + r0 * Math.cos(a), cy + r0 * Math.sin(a)], [cx + r1 * Math.cos(a), cy + r1 * Math.sin(a)]];
  });
  const MX = (...strokes) => strokes.flatMap(s => [s, s.map(([x, y]) => [100 - x, y])]);   // stroke + its mirror

  function windmillBlades() {
    const out = [];
    for (const deg of [35, 125, 215, 305]) {
      const a = deg * Math.PI / 180, ux = Math.cos(a), uy = Math.sin(a), px = -uy, py = ux;
      const at = (d, w) => [50 + ux * d + px * w, 38 + uy * d + py * w];
      out.push([at(3, 0), at(36, 0)]);
      out.push([at(12, 0), at(12, 8), at(36, 8), at(36, 0)]);
    }
    return out;
  }
  function ferrisCars() {
    return Array.from({ length: 8 }, (_, i) => {
      const a = (i * 45) * Math.PI / 180, x = 50 + 30 * Math.cos(a), y = 40 + 30 * Math.sin(a);
      return P(x - 3.5, y + 1, x + 3.5, y + 1, x + 3.5, y + 7, x - 3.5, y + 7, x - 3.5, y + 1);
    });
  }

  const AR = (cx, cy, rx, ry, rot) => {      // rotated ellipse
    const r = rot * Math.PI / 180, o = [];
    for (let i = 0; i <= 36; i++) { const t = i / 36 * 2 * Math.PI, x = rx * Math.cos(t), y = ry * Math.sin(t); o.push([cx + x * Math.cos(r) - y * Math.sin(r), cy + x * Math.sin(r) + y * Math.cos(r)]); }
    return o;
  };
  const fan = (cx, cy, r0, r1, angles) => angles.map(d => { const a = d * Math.PI / 180; return [[cx + r0 * Math.cos(a), cy + r0 * Math.sin(a)], [cx + r1 * Math.cos(a), cy + r1 * Math.sin(a)]]; });
  function stegoPlates() {
    return [200, 220, 240, 260, 280, 300, 320].map(deg => {
      const a = deg * Math.PI / 180, px = 48 + 30 * Math.cos(a), py = 62 + 16 * Math.sin(a);
      let nx = Math.cos(a) / 30, ny = Math.sin(a) / 16; const l = Math.hypot(nx, ny); nx /= l; ny /= l;
      const tx = -ny, ty = nx, h = 7 + 6 * Math.sin(Math.PI * (deg - 200) / 120);
      return [[px - tx * 4, py - ty * 4], [px + nx * h, py + ny * h], [px + tx * 4, py + ty * 4]];
    });
  }
  function peacockFan() {
    const out = [A(50, 60, 42, 40, 180, 360)];
    for (let d = 195; d <= 345; d += 25) {
      const a = d * Math.PI / 180;
      out.push(P(50, 60, 50 + 30 * Math.cos(a), 60 + 28 * Math.sin(a)), A(50 + 34 * Math.cos(a), 60 + 32 * Math.sin(a), 3.5));
    }
    return out;
  }
  function coaster() {
    const t1 = B(4, 84, 18, 20, 34, 20, 46, 56), t2 = B(66, 58, 76, 84, 86, 40, 96, 40);
    const sup = p => P(p[0], p[1], p[0], 92);
    const c = t1[7];
    return [t1, A(56, 58, 10, 12), t2, sup(t1[4]), sup(t1[8]), sup(t1[12]), sup(t2[9]), sup(t2[13]), sup(t2[16]), P(2, 92, 98, 92),
      P(c[0] - 6, c[1] - 1, c[0] - 6, c[1] - 7, c[0] + 6, c[1] - 7, c[0] + 6, c[1] - 1)];
  }

  // names[0] is the answer shown; the rest are also accepted.
  const PICTURES = [
    { names: ['t rex', 'trex', 'tyrannosaurus', 'tyrannosaurus rex', 'dinosaur', 'dino', 'raptor'], s: [
      P(4, 60, 22, 50, 38, 40, 52, 34, 60, 30, 63, 20, 70, 14, 86, 14, 94, 20, 94, 27, 80, 29, 93, 31, 92, 36, 76, 38, 70, 42, 67, 52, 62, 60, 54, 65, 44, 66, 30, 62, 4, 60),
      P(42, 62, 46, 74, 40, 88, 50, 88), P(56, 63, 60, 74, 56, 88, 66, 88), P(68, 48, 74, 52, 76, 49), A(78, 20, 1.8), P(82, 29, 83, 31.5, 85, 29, 86, 31.5, 88, 29)] },
    { names: ['stegosaurus', 'dinosaur', 'dino', 'stego'], s: [
      A(48, 62, 30, 16, 180, 360), A(48, 62, 30, 8, 0, 180), ...stegoPlates(), P(19, 60, 3, 52, 19, 66), P(8, 54, 5, 45), P(12, 56, 10, 47),
      P(78, 62, 90, 64, 94, 70, 86, 72, 78, 68), A(89, 66, 1), P(26, 68, 26, 86, 34, 86, 34, 70), P(60, 69, 60, 86, 68, 86, 68, 67)] },
    { names: ['octopus', 'squid', 'kraken'], s: [
      A(50, 34, 18, 20, 150, 390), B(34, 44, 22, 58, 30, 70, 14, 80), B(40, 47, 34, 62, 42, 76, 32, 90), B(47, 48, 46, 64, 54, 74, 46, 90),
      B(53, 48, 56, 64, 48, 76, 58, 90), B(60, 47, 68, 62, 60, 76, 70, 90), B(66, 44, 80, 58, 70, 70, 86, 80), A(43, 34, 3), A(57, 34, 3)] },
    { names: ['scorpion'], s: [

      P(42, 54, 30, 52, 24, 58), P(42, 58, 28, 60, 22, 68), P(42, 62, 30, 68, 26, 76), P(43, 66, 34, 74, 32, 84)), A(47, 47, 1), A(53, 47, 1)] },
    { names: ['seahorse', 'sea horse'], s: [
      P(64, 20, 84, 22, 84, 27, 66, 28), B(64, 20, 60, 10, 46, 10, 46, 22), B(46, 22, 34, 32, 32, 52, 44, 62), B(66, 28, 58, 36, 62, 54, 52, 64),
      B(44, 62, 50, 72, 44, 80, 38, 80), B(52, 64, 58, 76, 52, 92, 38, 90), SP(39, 85, 6, 1.3, 270), A(56, 18, 1.5), P(36, 42, 26, 38, 26, 52, 34, 50),
      P(39, 30, 35, 27), P(36, 38, 31, 37), P(35, 46, 30, 46)] },
    { names: ['flamingo'], s: [
      A(40, 40, 18, 10), B(56, 36, 72, 30, 72, 14, 62, 10), A(60, 12, 4), P(57, 15, 54, 21, 57, 25), P(42, 50, 42, 92), P(42, 92, 49, 92),

  // Make every round hard: random mirror and tilt, shuffled stroke order, some lines left out, shaky pen.
  // Left-out lines are drawn in pink when the answer is revealed.
  const len = s => s.reduce((t, p, i) => i ? t + Math.hypot(p[0] - s[i - 1][0], p[1] - s[i - 1][1]) : 0, 0);
  function prep(pic, seed) {
    let h = (seed * 2654435761 + 1013904223) >>> 0 || 1;
    const rnd = () => { h ^= h << 13; h >>>= 0; h ^= h >>> 17; h ^= h << 5; h >>>= 0; return h / 4294967296; };
    const flip = rnd() < 0.5, ang = (rnd() * 2 - 1) * 35 * Math.PI / 180, ca = Math.cos(ang), sa = Math.sin(ang);
    let raw = pic.s.map(s => s.map(([x, y]) => {
      if (flip) x = 100 - x;
      const dx = x - 50, dy = y - 50;
      return [50 + dx * ca - dy * sa, 50 + dx * sa + dy * ca];
    }));
    // fit the tilted picture back inside the pad
    const all = raw.flat(), xs = all.map(p => p[0]), ys = all.map(p => p[1]);
    const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
    const k = Math.min(1, 88 / Math.max(maxX - minX, maxY - minY)), cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    raw = raw.map(s => s.map(([x, y]) => [50 + (x - cx) * k, 50 + (y - cy) * k]));
    raw = raw.map(s => rnd() < 0.5 ? s.slice().reverse() : s);
    // leave out about a third of the strokes, but always keep the longest one (the main outline)
    const longest = raw.reduce((b, s, i) => len(s) > len(raw[b]) ? i : b, 0);
    const dropN = raw.length >= 4 ? Math.floor(raw.length * (0.25 + rnd() * 0.15)) : 0;
    const dropIdx = new Set(raw.map((_, i) => i).filter(i => i !== longest).sort(() => rnd() - 0.5).slice(0, dropN));
    let order = raw.map((s, i) => ({ s, hidden: dropIdx.has(i) }));
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    let total = 0;
    const strokes = order.map(({ s: src, hidden }) => {
      const pts = [src[0]];
      for (let i = 1; i < src.length; i++) {
        const [x0, y0] = src[i - 1], [x1, y1] = src[i];
        const n = Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0) / 3));
        for (let q = 1; q <= n; q++) {
          const f = q / n, last = (q === n);
          pts.push([x0 + (x1 - x0) * f + (last ? 0 : (rnd() - .5) * 1.4), y0 + (y1 - y0) * f + (last ? 0 : (rnd() - .5) * 1.4)]);
        }
      }
      const seg = [0];
      let l = 0;
      for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); l += d; }
      if (!hidden) total += l;
      return { pts, seg, hidden };
    });
    return { names: pic.names, strokes, total };
  }

      const a = document.createElement('span'); a.className = 'pos'; a.textContent = pos + '.';
      const b = document.createElement('span'); b.className = 'nm'; b.textContent = nameOf(id) + (id === myId ? ' (you)' : '');
      const c = document.createElement('span'); c.className = 'sc'; c.textContent = sc;
      li.append(a, b, c);
      return li;
    }));
    el.again.hidden = !isHost;
    el.endNote.textContent = isHost ? 'Play again? You can switch modes first.' : 'Waiting for the host to start a rematch.';
    show('end');
  }

  // ---------- host: runs the game ----------
  el.start.addEventListener('click', startGame);
  el.again.addEventListener('click', () => { phase = 'lobby'; show('lobby'); refreshLobby(); });

  function startGame() {
    const players = [myId, ...others()];
    if (players.length < 2) return;
    scores = {}; for (const id of players) scores[id] = 0;
    if (mode === 'robot') {
      order = shuffle(PICTURES.map((_, i) => i)).slice(0, TOTAL);
      seeds = order.map(() => Math.floor(Math.random() * 1e9));
      total = order.length;
    } else {
      const cycles = players.length <= 3 ? 2 : 1;
      drawOrder = [];
      for (let c = 0; c < cycles; c++) drawOrder.push(...shuffle(players.slice()));
      total = drawOrder.length;
    }
    send({ t: 'start', mode, total, scores, names: knownNames() });
    countdown(() => nextRound(0));
  }

  function nextRound(i) {
    if (mode === 'robot') {
      send({ t: 'round', i, d: order[i], s: seeds[i] });
      beginRobot(i, order[i], seeds[i]);
      roundTimer = setTimeout(endRound, ROUND_MS);
      return;
    }
    while (i < total && !online[drawOrder[i]]) i++;           // skip players who left
    if (i >= total) { finish(); return; }
    const opts = shuffle(WORDS.slice()).slice(0, 3);
    send({ t: 'pick', i, drawer: drawOrder[i], options: opts, total });
    beginChoosing(i, drawOrder[i], opts);
    chooseTimer = setTimeout(() => hostChose(i, Math.floor(Math.random() * 3)), CHOOSE_MS);
  }

  function hostChose(i, k) {
    if (phase !== 'choosing' || i !== roundI) return;
    word = options[k] || options[0];
    if (drawer === myId) pendingWord = word;
    const m = word.replace(/[^ ]/g, '_');
    send({ t: 'turn', i, drawer, mask: m });
    beginDrawTurn(i, drawer, m, drawer === myId ? word : null);
    roundTimer = setTimeout(endRound, TURN_MS);
    if (word.replace(/ /g, '').length >= 4) hintTimers = [0.5, 0.75].map(f => setTimeout(revealLetter, TURN_MS * f));
  }

  function revealLetter() {
    if (phase !== 'round' || mode !== 'draw') return;
    const open = [...mask].map((c, i) => c === '_' ? i : -1).filter(i => i >= 0);
    if (open.length < 2) return;
    const j = open[Math.floor(Math.random() * open.length)];
    mask = mask.slice(0, j) + word[j] + mask.slice(j + 1);
    send({ t: 'hint', i: roundI, mask });
    paintHint();
  }

  // The host checks every guess, so the answer never has to be sent to the guessers.
  function judge(id, text) {
    if (phase !== 'round' || !text) return;
    if (mode === 'draw' && id === drawer) return;
    if (gots.some(g => g.id === id)) return;
    const answers = mode === 'robot' ? PICTURES[curD].names : [word];
    if (isMatch(text, answers)) {
      const pts = POINTS[gots.length] || 1;
      scores[id] = (scores[id] || 0) + pts;
      if (mode === 'draw') scores[drawer] = (scores[drawer] || 0) + 1;
      const m = { t: 'got', i: roundI, id, pts, scores, names: { [id]: nameOf(id) } };
      send(m); onGot(m);
      checkAllGot();
    } else if (isClose(text, answers)) {
      if (id === myId) feed('So close!', 'close'); else send({ t: 'close', id });   // close guesses stay private
    } else {
      send({ t: 'chat', i: roundI, id, text });
      if (id !== myId) feed(nameOf(id) + ': ' + text);
    }
  }

  function checkAllGot() {
    if (!isHost || phase !== 'round') return;
    const need = Object.keys(online).filter(x => !(mode === 'draw' && x === drawer));
    if (need.length && need.every(x => gots.some(g => g.id === x))) endRound();
  }

  function endRound() {
    if (phase !== 'round' && phase !== 'choosing') return;
    stopTimers();
    const m = { t: 'result', i: roundI, mode, d: curD, s: curS, word: mode === 'draw' ? word : '', drawer, gots, scores, names: knownNames() };
    send(m); showResult(m);
    nextTimer = setTimeout(() => { if (roundI + 1 < total) nextRound(roundI + 1); else finish(); }, REVEAL_MS);
  }
  function finish() { stopTimers(); phase = 'end'; send({ t: 'end', scores, names: knownNames() }); showEnd(); }

  // Tell a (re)joining player where the game is.
  function sendSync(forId) {
    const m = { t: 'sync', for: forId, mode, total, phase, i: roundI, elapsed: performance.now() - t0, scores, gots, names: knownNames(), d: curD, s: curS, drawer, mask };
    if (mode === 'draw') {
      m.ink = ink;
      if (forId === drawer) { m.word = word; if (phase === 'choosing') m.options = options; }
      if (phase === 'reveal') m.word = word;
    }
    send(m);
  }
  function applySync(m) {
    mode = m.mode || 'robot'; total = m.total || total; scores = m.scores || {};
    if (m.phase === 'end') { showEnd(); return; }
    if (m.phase === 'countdown') { if (phase !== 'countdown') countdown(); return; }
    const mine = () => { if ((m.gots || []).some(g => g.id === myId)) { iGot = true; setGuessing(false, 'You got it! Waiting for the others…'); } };
    if (mode === 'robot') {
      beginRobot(m.i, m.d, m.s, m.elapsed);
      gots = m.gots || [];
      if (m.phase === 'reveal') showResult({ mode, i: m.i, d: m.d, s: m.s, gots, scores, drawer: null }); else mine();
    } else if (m.phase === 'choosing') {
      beginChoosing(m.i, m.drawer, m.options, m.elapsed);
    } else {
      beginDrawTurn(m.i, m.drawer, m.mask, m.word, m.elapsed);
      gots = m.gots || []; ink = m.ink || []; renderInk();
      if (m.phase === 'reveal') showResult({ mode, i: m.i, word: m.word, drawer: m.drawer, gots, scores }); else mine();
    }
    paintPlayers();
  }

  // ---------- guessing ----------
  el.form.addEventListener('submit', e => {
    e.preventDefault();
    const text = el.guess.value.trim().slice(0, 24);
    if (phase !== 'round' || iGot || !text) return;
    if (mode === 'draw' && drawer === myId) return;
    el.guess.value = '';
    feed('You: ' + text);
    if (isHost) judge(myId, text); else send({ t: 'guess', i: roundI, id: myId, text });
    el.guess.focus({ preventScroll: true });
  });

  // ---------- draw mode: pen, tools and live ink ----------
  const INKS = ['#1f1d36', '#e63946', '#f4a261', '#f2c94c', '#2a9d8f', '#3a86ff', '#8338ec', '#8d5a3b', '#fffdf6'];
  const SIZES = [0.8, 1.8, 4.2];
  let penColor = INKS[0], penSize = SIZES[1], outbox = [], flushTimer = 0, penDown = false, lastPt = null;

  const canDraw = () => mode === 'draw' && phase === 'round' && drawer === myId;
  function inkXY(e) {
    const r = el.cv.getBoundingClientRect();
    return [Math.round((e.clientX - r.left) / r.width * 1000) / 10, Math.round((e.clientY - r.top) / r.height * 1000) / 10];
  }
  function pushOps(...ops) { applyOps(ops); outbox.push(...ops); if (!flushTimer) flushTimer = setTimeout(flush, 60); }
  function flush() { flushTimer = 0; if (!outbox.length) return; send({ t: 'ink', i: roundI, ops: outbox }); outbox = []; }
  el.cv.addEventListener('pointerdown', e => {
    if (!canDraw()) return;
    e.preventDefault();
    try { el.cv.setPointerCapture(e.pointerId); } catch (err) {}
    penDown = true; lastPt = inkXY(e);
    pushOps(['s', penColor, penSize, lastPt[0], lastPt[1]]);
  });
  el.cv.addEventListener('pointermove', e => {
    if (!penDown || !canDraw()) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of (evs.length ? evs : [e])) {
      const p = inkXY(ev);
      if (lastPt && Math.hypot(p[0] - lastPt[0], p[1] - lastPt[1]) < 0.5) continue;
      lastPt = p; pushOps(['p', p[0], p[1]]);
    }
  });
  const penUp = () => { penDown = false; lastPt = null; };
  el.cv.addEventListener('pointerup', penUp);
  el.cv.addEventListener('pointercancel', penUp);

  function applyOps(ops) {
    let full = false;
    for (const op of ops) {
      if (op[0] === 's') { ink.push({ c: op[1], w: op[2], pts: [[op[3], op[4]]] }); if (!full) drawStroke(ink[ink.length - 1], 0); }
      else if (op[0] === 'p') { const s = ink[ink.length - 1]; if (!s) continue; s.pts.push([op[1], op[2]]); if (!full) drawStroke(s, s.pts.length - 2); }
      else if (op[0] === 'u') { ink.pop(); full = true; }
      else if (op[0] === 'c') { ink = []; full = true; }
    }
    if (full) renderInk();
  }
  function drawStroke(s, from) {
    const k = el.cv.width / 100;
    ctx.strokeStyle = s.c; ctx.fillStyle = s.c; ctx.lineWidth = s.w * k; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (s.pts.length === 1) { ctx.beginPath(); ctx.arc(s.pts[0][0] * k, s.pts[0][1] * k, s.w * k / 2, 0, Math.PI * 2); ctx.fill(); return; }
    const a = s.pts[Math.max(0, from)];
    ctx.beginPath(); ctx.moveTo(a[0] * k, a[1] * k);
    for (let i = Math.max(0, from) + 1; i < s.pts.length; i++) ctx.lineTo(s.pts[i][0] * k, s.pts[i][1] * k);
    ctx.stroke();
  }
  function renderInk() { ctx.clearRect(0, 0, el.cv.width, el.cv.height); for (const s of ink) drawStroke(s, 0); }

  function buildTools() {
    const sw = INKS.map((c, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'sw' + (i === 0 ? ' on' : '') + (i === INKS.length - 1 ? ' eraser' : '');
      b.style.setProperty('--c', c);
      b.setAttribute('aria-label', i === INKS.length - 1 ? 'Eraser' : 'Colour ' + (i + 1));
      b.addEventListener('click', () => { penColor = c; el.tools.querySelectorAll('.sw').forEach(x => x.classList.toggle('on', x === b)); });
      return b;
    });
    const sz = SIZES.map((w, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'sz' + (i === 1 ? ' on' : '');
      b.setAttribute('aria-label', ['Thin', 'Medium', 'Thick'][i] + ' pen');
      const d = document.createElement('i'); d.style.setProperty('--d', [5, 9, 15][i] + 'px'); b.append(d);
      b.addEventListener('click', () => { penSize = w; el.tools.querySelectorAll('.sz').forEach(x => x.classList.toggle('on', x === b)); });
      return b;
    });
    const tb = (label, fn) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'tbtn'; b.textContent = label; b.addEventListener('click', fn); return b; };
    el.tools.replaceChildren(...sw, ...sz,
      tb('Undo', () => { if (canDraw() && ink.length) pushOps(['u']); }),
      tb('Clear', () => { if (canDraw()) pushOps(['c']); }));
  }
  buildTools();

  // ---------- canvas ----------
  function sizeCanvas() {
    const r = el.board.getBoundingClientRect();
    const size = Math.max(120, Math.floor(Math.min(r.width, r.height)));
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    el.cv.style.width = el.cv.style.height = size + 'px';
    if (el.cv.width !== Math.round(size * dpr)) { el.cv.width = el.cv.height = Math.round(size * dpr); }
    if (mode === 'draw') renderInk();
    else if (cur && phase === 'reveal') draw(1, true);
  }
  new ResizeObserver(() => { if (!el.game.hidden) sizeCanvas(); }).observe(el.board);

  function drawPic(c2, pic, p, reveal) {
    const s = c2.canvas.width, k = s / 100;
    c2.clearRect(0, 0, s, s);
    if (!pic) return;
    c2.lineWidth = s * 0.014; c2.lineCap = 'round'; c2.lineJoin = 'round';
    if (reveal) {                      // show the lines that were left out, in pink
      c2.strokeStyle = '#ff6f9c'; c2.setLineDash([s * 0.02, s * 0.02]);
      for (const st of pic.strokes) if (st.hidden) { c2.beginPath(); st.pts.forEach(([x, y], i) => i ? c2.lineTo(x * k, y * k) : c2.moveTo(x * k, y * k)); c2.stroke(); }
      c2.setLineDash([]);
    }
    c2.strokeStyle = '#1f1d36';
    let left = pic.total * p, tip = null;
    for (const st of pic.strokes) {
      if (st.hidden) continue;
      if (left <= 0) break;
      c2.beginPath();
      c2.moveTo(st.pts[0][0] * k, st.pts[0][1] * k);
      for (let i = 1; i < st.pts.length; i++) {
        const d = st.seg[i];
        if (left >= d) { c2.lineTo(st.pts[i][0] * k, st.pts[i][1] * k); left -= d; tip = st.pts[i]; }
        else {
          const f = left / d, a = st.pts[i - 1], b = st.pts[i];
          tip = [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
          c2.lineTo(tip[0] * k, tip[1] * k); left = 0; break;
        }
      }
      c2.stroke();
    }
    if (p < 1 && tip) { c2.fillStyle = '#ff6f9c'; c2.beginPath(); c2.arc(tip[0] * k, tip[1] * k, s * 0.016, 0, Math.PI * 2); c2.fill(); }
  }
  const draw = (p, reveal) => drawPic(ctx, cur, p, reveal);

  // ---------- go ----------
  if (params.has('sheet')) {           // picture check sheet for editing the drawings
    document.getElementById('app').hidden = true;
    const grid = document.createElement('div'); grid.id = 'sheet';
    PICTURES.forEach((pic, i) => {
      const f = document.createElement('figure'), c = document.createElement('canvas');
      c.width = c.height = 300; f.append(c, Object.assign(document.createElement('figcaption'), { textContent: (i + 1) + '. ' + pic.names[0] }));
      grid.append(f); drawPic(c.getContext('2d'), prep(pic, i + 7), 1, true);
    });
    document.body.append(grid);
  } else if (typeof supabase === 'undefined' || typeof QRCode === 'undefined') {
    setStatus('The game couldn\'t load. Check your internet and try again.', 'bad'); el.retry.hidden = false;
  } else if (isHost) {
    code = Array.from({ length: 4 }, () => 'abcdefghjkmnpqrstuvwxyz'[Math.floor(Math.random() * 23)]).join('');
    setStatus('Setting up…');
    connect();
  } else {
    setStatus('Joining the game…');
    connect();
  }

  window.__dd = { PICTURES, WORDS, isMatch, isClose, prep, get state() { return { phase, mode, roundI, total, scores, role, myId, drawer, gots, answer: mode === 'robot' ? (cur && cur.names[0]) : (word || null), mask, options, ink: ink.length, online: Object.keys(online).length }; } };
})();
</script>
</body>
</html>
