<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1d1b3a">
<title>Doodle Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
  /* Layout: one fixed full-screen column per screen; the sketch pad takes all spare height. */
  :root {
    --bg: #1d1b3a;
    --bg-2: #2a2752;
    --paper: #fffdf6;
    --ink: #1f1d36;
    --text: #f4f1ff;
    --muted: #a9a4d4;
    --me: #3ddbd9;
    --them: #ff6f9c;
    --pop: #ffd23f;
    --font: "Fredoka", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
  body { overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }

  #app {
    position: fixed; left: 0; top: 0; width: 100%;
    height: var(--vvh, 100dvh);
    padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    display: flex; justify-content: center;
  }
  .screen { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }

  h1 { margin: 0; font-size: clamp(40px, 13vw, 60px); line-height: .92; font-weight: 700; letter-spacing: -.01em; }
  h1 span { color: var(--pop); }
  .tag { margin: 0; color: var(--muted); font-size: 17px; }

  label { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  input {
    font: inherit; font-size: 18px; width: 100%; min-width: 0;
    padding: 12px 14px; border-radius: 14px; border: 2px solid transparent;
    background: var(--bg-2); color: var(--text); outline: none;
  }
  input:focus { border-color: var(--pop); }
  input::placeholder { color: var(--muted); }

  button {
    font: inherit; font-weight: 600; font-size: 19px; cursor: pointer;
    padding: 14px 18px; border: 0; border-radius: 16px;
    background: var(--pop); color: var(--ink);
    box-shadow: 0 4px 0 #c79a0e; transition: transform .06s, box-shadow .06s;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #c79a0e; }
  button:disabled { background: var(--bg-2); color: var(--muted); box-shadow: none; cursor: default; transform: none; }
  button.ghost { background: transparent; color: var(--text); box-shadow: none; border: 2px solid var(--bg-2); font-size: 16px; padding: 10px 14px; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--pop); outline-offset: 2px; }

  /* Lobby */
  #lobby { overflow-y: auto; justify-content: center; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  #hostBox { display: flex; flex-direction: column; align-items: center; gap: 10px; background: var(--bg-2); border-radius: 22px; padding: 16px; }
  #qr { background: #fff; padding: 10px; border-radius: 14px; line-height: 0; min-height: 190px; min-width: 190px; }
  #qr img, #qr canvas { width: 170px; height: 170px; }
  #codeLine { margin: 0; color: var(--muted); }
  #codeLine b { color: var(--text); letter-spacing: .2em; font-size: 20px; }
  #status { margin: 0; min-height: 1.4em; font-size: 17px; text-align: center; }
  #status.ok { color: var(--me); }
  #status.bad { color: var(--them); }

  /* Game */
  .scores { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
  .pl { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .pl span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
  .pl b { font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
  .pl.me b, .pl.me span { color: var(--me); }
  .pl.them { justify-content: flex-end; }
  .pl.them b, .pl.them span { color: var(--them); }
  .pl.bump b { animation: bump .45s; }
  @keyframes bump { 40% { transform: scale(1.5); } }
  #roundNo { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .timer { height: 8px; border-radius: 8px; background: var(--bg-2); overflow: hidden; flex: none; }
  .timer i { display: block; height: 100%; width: 100%; background: var(--pop); transform-origin: left; }

  .board { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; }
  canvas { background: var(--paper); border-radius: 20px; box-shadow: 0 6px 0 rgba(0,0,0,.25); display: block; }
  #banner, #count {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none;
  }
  #banner { justify-content: flex-end; padding-bottom: 6%; }
  #banner .word { background: var(--ink); color: var(--pop); font-size: clamp(24px, 8vw, 38px); font-weight: 700; padding: 6px 18px; border-radius: 14px; text-transform: capitalize; }
  #banner .who { margin-top: 6px; background: var(--ink); color: var(--text); padding: 4px 12px; border-radius: 10px; font-size: 16px; }
  #banner .who.me { color: var(--me); }
  #banner .who.them { color: var(--them); }
  #count { font-size: 120px; font-weight: 700; color: var(--pop); text-shadow: 0 6px 0 rgba(0,0,0,.3); }

  #feed { height: 22px; flex: none; font-size: 15px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  #feed .them { color: var(--them); }
  #guessForm { display: flex; gap: 8px; flex: none; }
  #guessForm input { flex: 1; background: var(--paper); color: var(--ink); }
  #guessForm input::placeholder { color: #8d89a8; }
  #guessForm input:disabled { opacity: .55; }
  #guessForm button { flex: none; }
  .shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }

  /* End */
  #end { justify-content: center; text-align: center; gap: 18px; }
  #endTitle { font-size: clamp(38px, 12vw, 56px); font-weight: 700; margin: 0; line-height: 1; }
  .final { display: flex; justify-content: center; gap: 28px; }
  .final div { display: flex; flex-direction: column; gap: 2px; }
  .final b { font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; }
  .final .me { color: var(--me); }
  .final .them { color: var(--them); }
  #endNote { margin: 0; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main id="app">

  <section id="lobby" class="screen">
    <h1>Doodle<br><span>Duel</span></h1>
    <p class="tag">The robot draws 20 pictures. First one to guess each picture gets the point.</p>
    <div class="field">
      <label for="name">Your name</label>
      <input id="name" maxlength="12" autocomplete="off" placeholder="Type your name">
    </div>
    <div id="hostBox" hidden>
      <div id="qr"></div>
      <p id="codeLine">Room <b id="code"></b></p>
      <button id="share" class="ghost" type="button">Send the link instead</button>
    </div>
    <p id="status" role="status">Setting up…</p>
    <button id="start" type="button" disabled hidden>Start game</button>
    <button id="retry" type="button" hidden>Try again</button>
  </section>

  <section id="game" class="screen" hidden>
    <header class="scores">
      <div class="pl me" id="plMe"><b id="sMe">0</b><span id="nMe">You</span></div>
      <div id="roundNo">1 / 20</div>
      <div class="pl them" id="plThem"><span id="nThem">Partner</span><b id="sThem">0</b></div>
    </header>
    <div class="timer"><i id="bar"></i></div>
    <div class="board" id="board">
      <canvas id="cv" width="300" height="300" aria-label="The picture being drawn"></canvas>
      <div id="banner" hidden><div class="word" id="bWord"></div><div class="who" id="bWho"></div></div>
      <div id="count" hidden></div>
    </div>
    <div id="feed" aria-live="polite"></div>
    <form id="guessForm" autocomplete="off">
      <input id="guess" placeholder="What is it?" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" maxlength="24" aria-label="Your guess">
      <button type="submit">Guess</button>
    </form>
  </section>

  <section id="end" class="screen" hidden>
    <p id="endTitle"></p>
    <div class="final">
      <div class="me"><b id="fMe">0</b><span id="fnMe"></span></div>
      <div class="them"><b id="fThem">0</b><span id="fnThem"></span></div>
    </div>
    <p id="endNote"></p>
    <button id="again" type="button" hidden>Play again</button>
  </section>

</main>

<script>

  // ---------- drawing helpers (100 x 100 grid, y goes down) ----------
  const P = (...n) => { const o = []; for (let i = 0; i < n.length; i += 2) o.push([n[i], n[i + 1]]); return o; };
  const A = (cx, cy, rx, ry = rx, a0 = 0, a1 = 360) => {
    const n = Math.max(8, Math.ceil(Math.abs(a1 - a0) / 12)), o = [];
    for (let i = 0; i <= n; i++) { const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180; o.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]); }

    { names: ['apple'], s: [A(50, 58, 24), P(50, 36, 53, 22), P(53, 28, 64, 20, 66, 28, 53, 28)] },
    { names: ['boat', 'sailboat', 'ship', 'yacht', 'sail boat'], s: [P(15, 65, 25, 82, 75, 82, 85, 65, 15, 65), P(50, 65, 50, 14), P(50, 17, 78, 58, 50, 58), P(47, 25, 26, 58, 47, 58), P(8, 90, 16, 86, 24, 90, 32, 86, 40, 90, 48, 86, 56, 90, 64, 86, 72, 90, 80, 86, 88, 90)] },

    { names: ['clock', 'watch', 'time'], s: [A(50, 50, 32), ...rays(50, 50, 27, 31, 12), P(50, 50, 50, 30), P(50, 50, 64, 57), A(50, 50, 1.5)] },

    { names: ['key', 'keys'], s: [A(28, 50, 14), A(28, 50, 5), P(42, 47, 86, 47, 86, 53, 42, 53), P(70, 53, 70, 62, 76, 62, 76, 53), P(81, 53, 81, 60)] },

    { names: ['rain', 'cloud', 'rain cloud', 'storm', 'raining', 'weather'], s: [A(34, 44, 11, 11, 90, 270), A(50, 33, 16, 13, 180, 360), A(66, 44, 11, 11, 270, 450), P(66, 55, 34, 55), P(36, 62, 32, 72), P(48, 62, 44, 72), P(60, 62, 56, 72), P(42, 76, 38, 86), P(54, 76, 50, 86)] },
    { names: ['pizza', 'slice', 'pizza slice'], s: [P(20, 25, 80, 25, 50, 90, 20, 25), P(23, 32, 77, 32), A(42, 43, 5), A(58, 45, 5), A(50, 63, 5)] },
    { names: ['glasses', 'spectacles', 'sunglasses', 'eyeglasses', 'specs'], s: [A(32, 50, 14), A(68, 50, 14), A(50, 50, 4, 4, 180, 360), P(18, 50, 8, 42), P(82, 50, 92, 42)] },
    { names: ['ladder', 'steps'], s: [P(35, 10, 35, 90), P(65, 10, 65, 90), P(35, 20, 65, 20), P(35, 35, 65, 35), P(35, 50, 65, 50), P(35, 65, 65, 65), P(35, 80, 65, 80)] },
    { names: ['lightbulb', 'light bulb', 'bulb', 'light', 'lamp', 'idea'], s: [A(50, 40, 22, 22, 120, 420), P(39, 59, 42, 72, 58, 72, 61, 59), P(43, 76, 57, 76), P(45, 80, 55, 80), P(44, 58, 46, 44, 50, 50, 54, 44, 56, 58)] },

    { names: ['candle', 'flame'], s: [P(40, 45, 40, 88, 60, 88, 60, 45, 40, 45), P(30, 88, 70, 88), P(50, 45, 50, 38), A(50, 28, 6, 10)] },
    { names: ['envelope', 'letter', 'mail', 'email', 'message', 'post'], s: [P(15, 30, 85, 30, 85, 72, 15, 72, 15, 30), P(15, 30, 50, 54, 85, 30)] },
    { names: ['cactus'], s: [P(42, 88, 42, 30), A(50, 30, 8, 8, 180, 360), P(58, 30, 58, 88), P(42, 64, 26, 64, 26, 42), A(30, 42, 4, 4, 180, 360), P(34, 42, 34, 56, 42, 56), P(58, 48, 66, 48, 66, 36), A(70, 36, 4, 4, 180, 360), P(74, 36, 74, 56, 58, 56), P(25, 88, 75, 88)] },

    { names: ['lollipop', 'lolly', 'candy', 'sucker', 'sweet'], s: [A(50, 35, 18), A(50, 35, 10, 10, 0, 300), P(50, 53, 50, 92)] },
    { names: ['smiley', 'smile', 'face', 'happy', 'emoji', 'smiley face', 'happy face'], s: [A(50, 50, 30), A(40, 42, 3, 4), A(60, 42, 3, 4), A(50, 54, 16, 14, 20, 160)] },
  ];

  // Subdivide each stroke and add a slight wobble so it looks hand-drawn.
  function prep(pic, seed) {
    let h = (seed + 1) * 2654435761 >>> 0;
    const rnd = () => { h ^= h << 13; h >>>= 0; h ^= h >>> 17; h ^= h << 5; h >>>= 0; return h / 4294967296 - .5; };
    let total = 0;
    const strokes = pic.s.map(raw => {
      const pts = [raw[0]];
      for (let i = 1; i < raw.length; i++) {
        const [x0, y0] = raw[i - 1], [x1, y1] = raw[i];
        const n = Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0) / 3));
        for (let k = 1; k <= n; k++) {
          const f = k / n, last = (k === n);
          pts.push([x0 + (x1 - x0) * f + (last ? 0 : rnd() * .7), y0 + (y1 - y0) * f + (last ? 0 : rnd() * .7)]);
        }
      }
      const seg = [0];
      for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); total += d; }
      return { pts, seg };
    });
    return { names: pic.names, strokes, total };
  }
  const PREPPED = PICTURES.map(prep);

  // ---------- guess checking ----------
  const norm = s => s.toLowerCase().replace(/[^a-z ]/g, '').replace(/\s+/g, ' ').trim();
  function lev(a, b) {
    if (Math.abs(a.length - b.length) > 1) return 2;
    let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = cur;
    }
    return prev[b.length];
  }
  function isMatch(guess, names) {
    const g = norm(guess).replace(/^(a|an|the) /, '');
    if (!g) return false;
    const joined = g.replace(/ /g, ''), words = g.split(' ');
    return names.some(n => {
      const nj = n.replace(/ /g, '');
      if (joined === nj || joined === nj + 's' || joined + 's' === nj) return true;
      if (words.includes(nj)) return true;
      return nj.length >= 5 && lev(joined, nj) <= 1;
    });
  }

  // ---------- elements ----------
  const $ = id => document.getElementById(id);
  const el = {
    lobby: $('lobby'), game: $('game'), end: $('end'),
    name: $('name'), hostBox: $('hostBox'), qr: $('qr'), code: $('code'), share: $('share'),
    status: $('status'), start: $('start'), retry: $('retry'),
    nMe: $('nMe'), nThem: $('nThem'), sMe: $('sMe'), sThem: $('sThem'), plMe: $('plMe'), plThem: $('plThem'),
    roundNo: $('roundNo'), bar: $('bar'), board: $('board'), cv: $('cv'),
    banner: $('banner'), bWord: $('bWord'), bWho: $('bWho'), count: $('count'),
    feed: $('feed'), form: $('guessForm'), guess: $('guess'),
    endTitle: $('endTitle'), fMe: $('fMe'), fThem: $('fThem'), fnMe: $('fnMe'), fnThem: $('fnThem'), endNote: $('endNote'), again: $('again'),
  };
  const ctx = el.cv.getContext('2d');

  // Keep the layout inside the visible area when the phone keyboard opens.
  function fitViewport() {
    const vv = window.visualViewport;
    document.documentElement.style.setProperty('--vvh', (vv ? vv.height : window.innerHeight) + 'px');
    window.scrollTo(0, 0);
  }
  if (window.visualViewport) { visualViewport.addEventListener('resize', fitViewport); visualViewport.addEventListener('scroll', fitViewport); }
  window.addEventListener('resize', fitViewport);
  fitViewport();

  // ---------- state ----------
  const params = new URLSearchParams(location.search);
  const joinCode = (params.get('room') || '').toLowerCase().replace(/[^a-z]/g, '').slice(0, 6);
  const role = joinCode ? 'guest' : 'host';
  const other = role === 'host' ? 'guest' : 'host';
  let ch = null, subscribed = false, partnerOn = false, readyOnce = false, findTimer = 0, code = joinCode;
  let theirName = '';
  let phase = 'lobby';            // lobby | countdown | round | reveal | end
  let scores = { host: 0, guest: 0 };
  let order = [], roundI = 0, cur = null, t0 = 0, raf = 0, waiting = false;
  let roundTimer = 0, nextTimer = 0, countTimer = 0, lastWinner = null;

  let savedName = '';
  try { savedName = localStorage.getItem('dd-name') || ''; } catch (e) {}
  el.name.value = savedName;
  const myName = () => el.name.value.trim() || (role === 'host' ? 'Player 1' : 'Player 2');
  const partnerName = () => theirName || 'Partner';

  function show(which) {
    for (const s of ['lobby', 'game', 'end']) el[s].hidden = (s !== which);
    if (which === 'game') sizeCanvas();
  }
  function setStatus(text, cls) { el.status.textContent = text; el.status.className = cls || ''; }
  const send = m => { if (ch && subscribed) ch.send({ type: 'broadcast', event: 'm', payload: m }); };

  // ---------- lobby / connection ----------
  el.name.addEventListener('input', () => {
    try { localStorage.setItem('dd-name', el.name.value.trim()); } catch (e) {}
    if (ch && subscribed) ch.track({ name: myName() });
    paintScores();
  });

  function joinUrl() { return location.origin + location.pathname + '?room=' + code; }

  function connect() {
    const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false }, realtime: { params: { eventsPerSecond: 20 } } });
    ch = sb.channel(PREFIX + code, { config: { broadcast: { self: false }, presence: { key: role } } });
    ch.on('broadcast', { event: 'm' }, ({ payload }) => onData(payload));
    ch.on('presence', { event: 'sync' }, () => {
      const list = ch.presenceState()[other] || [];
      if (list.length) theirName = String(list[list.length - 1].name || '').slice(0, 12);
      const on = list.length > 0;
      if (on !== partnerOn) { partnerOn = on; on ? onPartnerBack() : onPartnerGone(); }
      else paintScores();
    });
    ch.subscribe(async status => {
      if (status === 'SUBSCRIBED') {
        subscribed = true;
        el.retry.hidden = true;
        try { await ch.track({ name: myName() }); } catch (e) {}
        send({ t: 'hello' });          // lets the host resend the game state after a reconnect
        onReady();
      } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
        subscribed = false;
        if (phase === 'lobby') { setStatus('Couldn\'t reach the game server. Check your internet; it keeps retrying.', 'bad'); el.retry.hidden = false; }
        else feed('Connection lost, reconnecting…');
      } else if (status === 'CLOSED') subscribed = false;
    });
  }

  function onReady() {
    if (role === 'host') {
      if (!readyOnce) {
        readyOnce = true;
        el.hostBox.hidden = false; el.start.hidden = false;
        el.code.textContent = code.toUpperCase();
        el.qr.innerHTML = '';
        new QRCode(el.qr, { text: joinUrl(), width: 340, height: 340, correctLevel: QRCode.CorrectLevel.M });
      }
      refreshLobby();
    } else {
      if (phase === 'lobby' && !partnerOn) setStatus('Looking for the game…');
      clearTimeout(findTimer);
      findTimer = setTimeout(() => { if (!partnerOn && phase === 'lobby') guestFail('Couldn\'t find game ' + code.toUpperCase() + '. Make sure your partner\'s phone still shows the code, then try again.'); }, 12000);
    }
  }

  function hostInit() {
    code = Array.from({ length: 4 }, () => 'abcdefghjkmnpqrstuvwxyz'[Math.floor(Math.random() * 23)]).join('');
    setStatus('Setting up…');
    connect();
  }

  function guestInit() {
    setStatus('Joining the game…');
    connect();
  }
  function guestFail(text) { setStatus(text, 'bad'); el.retry.hidden = false; }

  function refreshLobby() {
    if (phase !== 'lobby') return;
    if (role === 'host') {
      el.start.disabled = !partnerOn;
      if (partnerOn) setStatus(partnerName() + ' is in. Start when you\'re both ready.', 'ok');
      else setStatus('Ask your partner to scan this with their phone camera.');
    } else if (partnerOn) {
      el.retry.hidden = true;
      setStatus('You\'re in. Waiting for ' + partnerName() + ' to start the game.', 'ok');
    }
  }

  function onPartnerBack() {
    clearTimeout(findTimer);
    if (phase === 'lobby') refreshLobby();
    else { feed(partnerName() + ' is back'); paintScores(); }
  }

  // Phones drop off briefly when the screen locks, so keep the game going and resync when they return.
  function onPartnerGone() {
    if (phase === 'lobby') {
      if (role === 'host') { el.start.disabled = true; setStatus('Waiting for your partner to scan the code.'); }
      else setStatus('Waiting for the host…');
    } else feed(partnerName() + ' disconnected, waiting for them…');
  }

  el.retry.addEventListener('click', () => location.reload());
  el.share.addEventListener('click', async () => {
    const url = joinUrl();
    try {
      if (navigator.share) await navigator.share({ title: 'Doodle Duel', text: 'Play Doodle Duel with me', url });
      else { await navigator.clipboard.writeText(url); el.share.textContent = 'Link copied'; setTimeout(() => el.share.textContent = 'Send the link instead', 1800); }
    } catch (e) {}
  });

  // ---------- messages ----------
  function onData(m) {
    if (!m || typeof m !== 'object') return;
    switch (m.t) {
      case 'miss': if (phase === 'round') feed(partnerName() + ': ' + String(m.text || '').slice(0, 24), true); break;
      // host only
      case 'hello': if (role === 'host' && phase !== 'lobby') sendSync(); break;
      case 'correct': if (role === 'host' && phase === 'round' && m.i === roundI) endRound('guest'); break;
      // guest only
      case 'start': if (role === 'guest') { scores = { host: 0, guest: 0 }; countdown(); } break;
      case 'round': if (role === 'guest') beginRound(m.i, m.d); break;
      case 'result': if (role === 'guest') { if (m.i !== roundI || !cur) beginRound(m.i, m.d); showResult(m); } break;
      case 'end': if (role === 'guest') { scores = m.scores; showEnd(); } break;
      case 'sync': if (role === 'guest') applySync(m); break;
    }
  }

  // ---------- game flow ----------
  function stopTimers() { clearTimeout(roundTimer); clearTimeout(nextTimer); clearTimeout(countTimer); cancelAnimationFrame(raf); }

  el.start.addEventListener('click', startGame);
  el.again.addEventListener('click', startGame);

  function sendSync() {             // host: tell a returning guest where the game is
    send({ t: 'sync', phase, i: roundI, d: order[roundI], elapsed: performance.now() - t0, scores, winner: lastWinner });
  }
  function applySync(m) {           // guest
    scores = m.scores;
    if (m.phase === 'end') { showEnd(); return; }
    if (m.phase === 'countdown') { if (phase !== 'countdown') countdown(); return; }
    if (m.i !== roundI || phase === 'lobby' || phase === 'end' || !cur) beginRound(m.i, m.d, m.elapsed);
    if (m.phase === 'reveal') showResult({ winner: m.winner, scores: m.scores });
    else paintScores();
  }

  function startGame() {            // host
    if (!partnerOn) return;
    order = PREPPED.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    order = order.slice(0, TOTAL);
    scores = { host: 0, guest: 0 };
    send({ t: 'start' });
    countdown(() => startRound(0));
  }

  function countdown(done) {
    stopTimers();
    phase = 'countdown';
    show('game');
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
    paintScores();
    el.roundNo.textContent = 'Get ready';
    el.banner.hidden = true; el.feed.textContent = '';
    el.guess.disabled = true; el.guess.value = '';
    el.bar.style.transform = 'scaleX(1)';
    ctx.clearRect(0, 0, el.cv.width, el.cv.height);
    let n = 3;
    el.count.hidden = false; el.count.textContent = n;
    const tick = () => {
      n--;
      if (n > 0) { el.count.textContent = n; countTimer = setTimeout(tick, 1000); }
      else { el.count.hidden = true; if (done) done(); }
    };
    countTimer = setTimeout(tick, 1000);
  }

  function startRound(i) {          // host
    send({ t: 'round', i, d: order[i] });
    beginRound(i, order[i]);
    roundTimer = setTimeout(() => endRound(null), ROUND_MS);
  }

  function beginRound(i, d, elapsed = 0) {
    clearTimeout(countTimer); cancelAnimationFrame(raf);
    phase = 'round'; roundI = i; cur = PREPPED[d]; waiting = false;
    t0 = performance.now() - Math.max(0, Math.min(ROUND_MS, elapsed || 0));
    show('game');
    el.count.hidden = true; el.banner.hidden = true;
    el.roundNo.textContent = (i + 1) + ' / ' + TOTAL;
    el.feed.textContent = '';
    el.guess.disabled = false; el.guess.value = '';
    el.guess.focus({ preventScroll: true });
    frame();
  }

  function frame() {
    if (phase !== 'round') return;
    const t = performance.now() - t0;
    draw(Math.min(1, t / DRAW_MS));
    el.bar.style.transform = 'scaleX(' + Math.max(0, 1 - t / ROUND_MS) + ')';
    raf = requestAnimationFrame(frame);
  }

  function endRound(winner) {       // host
    if (phase !== 'round') return;
    clearTimeout(roundTimer);
    if (winner) scores[winner]++;
    lastWinner = winner;
    const m = { t: 'result', i: roundI, d: order[roundI], winner, scores };
    send(m);
    showResult(m);
    nextTimer = setTimeout(() => {
      if (roundI + 1 < TOTAL) startRound(roundI + 1);
      else { send({ t: 'end', scores }); showEnd(); }
    }, REVEAL_MS);
  }

  function showResult(m) {
    phase = 'reveal';
    cancelAnimationFrame(raf);
    scores = m.scores;
    draw(1);
    el.guess.disabled = true; el.guess.value = '';
    el.bWord.textContent = cur ? cur.names[0] : '';
    el.bWho.className = 'who' + (m.winner === role ? ' me' : m.winner ? ' them' : '');
    el.bWho.textContent = m.winner === role ? 'You got it' : m.winner ? partnerName() + ' got it' : 'Nobody got it';
    el.banner.hidden = false;
    paintScores(m.winner);
  }

  function showEnd() {
    stopTimers();
    phase = 'end';
    const me = scores[role], them = scores[other];
    el.endTitle.textContent = me > them ? 'You win!' : me < them ? partnerName() + ' wins!' : 'It\'s a tie!';
    el.fMe.textContent = me; el.fThem.textContent = them;
    el.fnMe.textContent = myName(); el.fnThem.textContent = partnerName();
    el.again.hidden = role !== 'host';
    el.endNote.textContent = role === 'host' ? 'Fancy a rematch?' : 'Waiting for ' + partnerName() + ' to start a rematch.';
    show('end');
  }

  function paintScores(bumped) {
    el.nMe.textContent = myName(); el.nThem.textContent = partnerName();
    el.sMe.textContent = scores[role]; el.sThem.textContent = scores[other];
    if (bumped) {
      const node = bumped === role ? el.plMe : el.plThem;
      node.classList.remove('bump'); void node.offsetWidth; node.classList.add('bump');
    }
  }

  function feed(text, theirs) {
    el.feed.textContent = text + ' ✗';
    el.feed.className = theirs ? 'them' : '';
  }

  el.form.addEventListener('submit', e => {
    e.preventDefault();
    const text = el.guess.value.trim();
    if (phase !== 'round' || waiting || !text) return;
    el.guess.value = '';
    if (isMatch(text, cur.names)) {
      if (role === 'host') endRound('host');
      else { waiting = true; send({ t: 'correct', i: roundI }); }
    } else {
      feed('You: ' + text);
      send({ t: 'miss', text });
      el.form.classList.remove('shake'); void el.form.offsetWidth; el.form.classList.add('shake');
    }
    el.guess.focus({ preventScroll: true });
  });

  // ---------- canvas ----------
  function sizeCanvas() {
    const r = el.board.getBoundingClientRect();
    const size = Math.max(120, Math.floor(Math.min(r.width, r.height)));
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    el.cv.style.width = el.cv.style.height = size + 'px';
    if (el.cv.width !== Math.round(size * dpr)) { el.cv.width = el.cv.height = Math.round(size * dpr); }
    if (cur && (phase === 'reveal')) draw(1);
  }
  new ResizeObserver(() => { if (!el.game.hidden) sizeCanvas(); }).observe(el.board);

  function draw(p) {
    const s = el.cv.width, k = s / 100;
    ctx.clearRect(0, 0, s, s);
    if (!cur) return;
    ctx.lineWidth = s * 0.014; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1f1d36';
    let left = cur.total * p, tip = null;
    for (const st of cur.strokes) {
      if (left <= 0) break;
      ctx.beginPath();
      ctx.moveTo(st.pts[0][0] * k, st.pts[0][1] * k);
      for (let i = 1; i < st.pts.length; i++) {
        const d = st.seg[i];
        if (left >= d) { ctx.lineTo(st.pts[i][0] * k, st.pts[i][1] * k); left -= d; tip = st.pts[i]; }
        else {
          const f = left / d, a = st.pts[i - 1], b = st.pts[i];
          tip = [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
          ctx.lineTo(tip[0] * k, tip[1] * k); left = 0; break;
        }
      }
      ctx.stroke();
    }
    if (p < 1 && tip) { ctx.fillStyle = '#ff6f9c'; ctx.beginPath(); ctx.arc(tip[0] * k, tip[1] * k, s * 0.016, 0, Math.PI * 2); ctx.fill(); }
  }

  // ---------- go ----------
  if (typeof supabase === 'undefined' || typeof QRCode === 'undefined') {
    setStatus('The game couldn\'t load. Check your internet and try again.', 'bad'); el.retry.hidden = false;
  } else if (role === 'host') hostInit(); else guestInit();

  window.__dd = { PICTURES, PREPPED, isMatch, get state() { return { phase, roundI, scores, role, answer: cur && cur.names[0] }; } };
})();
</script>
</body>
</html>
