<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1d1b3a">
<title>Doodle Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
  /* Layout: lobby is one centred column; the game is a players | pad | chat grid that folds to players | pad over chat on phones. */
  :root {
    --bg: #1d1b3a;
    --bg-2: #2a2752;
    --bg-3: #36326a;
    --paper: #fffdf6;
    --ink: #1f1d36;
    --text: #f4f1ff;
    --muted: #a9a4d4;
    --pop: #ffd23f;
    --bad: #ff6f9c;
    --good: #3ddbd9;
    --font: "Fredoka", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
  body { overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }

  #app {
    position: fixed; left: 0; top: 0; width: 100%;
    height: var(--vvh, 100dvh);
    padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    display: flex; justify-content: center;
  }
  .screen { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }

  h1 { margin: 0; font-size: clamp(40px, 13vw, 60px); line-height: .92; font-weight: 700; letter-spacing: -.01em; }
  h1 span { color: var(--pop); }
  .tag { margin: 0; color: var(--muted); font-size: 17px; }

  label, .label { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  input[type=text], input:not([type]) {
    font: inherit; font-size: 18px; width: 100%; min-width: 0;
    padding: 12px 14px; border-radius: 14px; border: 2px solid transparent;
    background: var(--bg-2); color: var(--text); outline: none;
  }
  input:focus { border-color: var(--pop); }
  input::placeholder { color: var(--muted); }

  button {
    font: inherit; font-weight: 600; font-size: 19px; cursor: pointer;
    padding: 14px 18px; border: 0; border-radius: 16px;
    background: var(--pop); color: var(--ink);
    box-shadow: 0 4px 0 #c79a0e; transition: transform .06s, box-shadow .06s;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #c79a0e; }
  button:disabled { background: var(--bg-2); color: var(--muted); box-shadow: none; cursor: default; transform: none; }
  button.ghost { background: transparent; color: var(--text); box-shadow: none; border: 2px solid var(--bg-2); font-size: 16px; padding: 10px 14px; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--pop); outline-offset: 2px; }

  /* ---------- lobby ---------- */
  #lobby { overflow-y: auto; gap: 12px; padding-bottom: 4px; }
  #lobby > :first-child { margin-top: auto; }
  #lobby > :last-child { margin-bottom: auto; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  #hostBox { display: flex; flex-direction: column; align-items: center; gap: 10px; background: var(--bg-2); border-radius: 22px; padding: 16px; }
  #qr { background: #fff; padding: 10px; border-radius: 14px; line-height: 0; min-height: 190px; min-width: 190px; }
  #qr img, #qr canvas { width: 170px; height: 170px; }
  #codeLine { margin: 0; color: var(--muted); }
  #codeLine b { color: var(--text); letter-spacing: .2em; font-size: 20px; }
  #status { margin: 0; min-height: 1.4em; font-size: 17px; text-align: center; }
  #status.ok { color: var(--good); }
  #status.bad { color: var(--bad); }
  #whoBox, #setBox { display: flex; flex-direction: column; gap: 8px; }
  #modeNote { margin: 0; text-align: center; color: var(--muted); }
  #modeNote b { color: var(--text); }

  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg button {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left;
    background: var(--bg-2); color: var(--text); box-shadow: none; border: 2px solid transparent; font-size: 17px; padding: 10px 12px;
  }
  .seg button small { font-weight: 400; font-size: 13px; color: var(--muted); }
  .seg button.on { border-color: var(--pop); }
  .seg button:active { transform: none; }
  .optrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .optrow > span { color: var(--muted); font-size: 15px; }
  .pills { display: flex; gap: 6px; }
  .pills button { box-shadow: none; padding: 6px 11px; font-size: 15px; border-radius: 10px; background: var(--bg-2); color: var(--text); border: 2px solid transparent; }
  .pills button.on { border-color: var(--pop); }
  .check { display: flex; gap: 10px; align-items: center; text-transform: none; letter-spacing: 0; font-size: 15px; color: var(--text); background: var(--bg-2); padding: 10px 12px; border-radius: 14px; cursor: pointer; }
  .check input { width: 20px; height: 20px; accent-color: var(--pop); flex: none; }
  .check small { display: block; color: var(--muted); font-size: 13px; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px 5px 8px; border-radius: 999px; background: var(--bg-2); border: 2px solid transparent; font-size: 15px; white-space: nowrap; }
  .chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
  .chip.me { border-color: var(--c); }

  /* ---------- game ---------- */
  #game { max-width: 1240px; gap: 8px; }
  .gtop { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; flex: none; }
  .clock { --ring: var(--pop); width: 50px; height: 50px; border-radius: 50%; position: relative; background: conic-gradient(var(--ring) calc(var(--left, 1) * 360deg), var(--bg-2) 0); flex: none; }
  .clock.low { --ring: var(--bad); }
  .clock span { position: absolute; inset: 5px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
  #hint { text-align: center; font-size: clamp(18px, 4.6vw, 32px); font-weight: 600; letter-spacing: .05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #hint small { font-size: .55em; color: var(--muted); font-weight: 400; letter-spacing: 0; }
  .ginfo { text-align: right; font-size: 14px; color: var(--muted); line-height: 1.25; font-variant-numeric: tabular-nums; }
  .ginfo b { display: block; color: var(--text); font-size: 15px; }

  .gmain { flex: 1; min-height: 0; display: grid; gap: 8px;
    grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "list" "board" "chat"; }
  .side { grid-area: list; display: flex; flex-direction: column; gap: 8px; min-height: 0; min-width: 0; }
  .plist { list-style: none; margin: 0; padding: 0 0 2px; display: flex; flex-direction: row; gap: 5px; overflow-x: auto; scrollbar-width: none; min-height: 0; }
  .plist::-webkit-scrollbar { display: none; }
  .plist li { position: relative; flex: none; display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 6px; align-items: baseline;
    background: var(--bg-2); border-radius: 12px; padding: 5px 20px 5px 8px; border: 2px solid transparent; max-width: 150px; }
  .plist .rk { grid-row: span 2; font-weight: 700; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .plist .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
  .plist .pt { font-size: 13px; color: var(--c); font-weight: 600; font-variant-numeric: tabular-nums; }
  .plist .ic { position: absolute; right: 6px; top: 4px; font-size: 13px; }
  .plist li.me { border-color: var(--c); }
  .plist li.got { background: color-mix(in srgb, var(--good) 28%, var(--bg-2)); }
  .plist li.drawing { background: color-mix(in srgb, var(--pop) 22%, var(--bg-2)); }
  .plist li.off { opacity: .45; }
  .plist li.bump .pt { animation: bump .6s; }
  @keyframes bump { 40% { transform: scale(1.35); } }
  #joinMini { display: none; flex-direction: column; align-items: center; gap: 6px; background: var(--bg-2); border-radius: 14px; padding: 10px; font-size: 13px; color: var(--muted); text-align: center; }
  #joinMini b { color: var(--text); letter-spacing: .15em; }
  #qrMini { background: #fff; padding: 6px; border-radius: 10px; line-height: 0; }
  #qrMini img, #qrMini canvas { width: 110px; height: 110px; }

  .board { grid-area: board; min-height: 0; min-width: 0; position: relative; display: flex; align-items: center; justify-content: center; }
  canvas#cv { background: var(--paper); border-radius: 16px; box-shadow: 0 6px 0 rgba(0,0,0,.25); display: block; }
  canvas.pen { touch-action: none; cursor: crosshair; }
  #banner, #count { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; }
  #banner { justify-content: flex-end; padding-bottom: 5%; }
  #banner .word { background: var(--ink); color: var(--pop); font-size: clamp(22px, 6vw, 40px); font-weight: 700; padding: 6px 18px; border-radius: 14px; text-transform: capitalize; max-width: 94%; }
  #banner .who { margin: 6px 10px 0; background: var(--ink); color: var(--c, var(--text)); padding: 4px 12px; border-radius: 10px; font-size: 15px; max-width: 94%; }
  #count { font-size: 120px; font-weight: 700; color: var(--pop); text-shadow: 0 6px 0 rgba(0,0,0,.3); }
  #choose { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: rgba(29, 27, 58, .92); border-radius: 16px; padding: 16px; text-align: center; }
  #chooseTitle { margin: 0; font-size: 22px; font-weight: 600; text-wrap: balance; }
  #chooseBtns { display: flex; flex-direction: column; gap: 10px; width: min(260px, 100%); }
  #chooseBtns button { text-transform: capitalize; }

  .chat { grid-area: chat; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
  #feed { height: 62px; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; font-size: 14px; color: var(--muted); }
  #feed div { flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 1px 0; }
  #feed b { color: var(--text); font-weight: 600; }
  #feed .good { color: var(--good); font-weight: 600; }
  #feed .close { color: var(--pop); font-weight: 600; }
  #feed .sys { color: var(--muted); font-style: italic; }
  #guessForm { display: flex; gap: 8px; flex: none; }
  #guessForm input { flex: 1; background: var(--paper); color: var(--ink); }
  #guessForm input::placeholder { color: #8d89a8; }
  #guessForm input:disabled { opacity: .55; }
  #guessForm button { flex: none; }

  @media (min-width: 760px) {
    .gmain { grid-template-columns: 210px minmax(0, 1fr) 270px; grid-template-rows: minmax(0, 1fr); grid-template-areas: "list board chat"; }
    .plist { flex-direction: column; overflow-x: hidden; overflow-y: auto; }
    .plist li { padding: 8px 24px 8px 10px; max-width: none; }
    .plist .nm { font-size: 16px; }
    .plist .pt { font-size: 14px; }
    .chat { background: var(--bg-2); border-radius: 16px; padding: 10px; }
    #feed { height: auto; flex: 1; justify-content: flex-start; overflow-y: auto; font-size: 15px; }
    #feed div { white-space: normal; padding: 3px 4px; border-radius: 6px; }
    #feed div:nth-child(odd) { background: rgba(255,255,255,.03); }
    .host-view #joinMini { display: flex; }
  }

  /* drawing tools */
  #tools { display: flex; flex-direction: column; gap: 6px; flex: none; }
  .trow { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; align-items: center; }
  #tools button { box-shadow: none; padding: 0; }
  #tools button:active { transform: scale(.92); }
  .tool { width: 38px; height: 34px; border-radius: 10px; background: var(--bg-2); color: var(--text); display: grid; place-items: center; border: 2px solid transparent; }
  .tool svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tool.on { border-color: var(--pop); color: var(--pop); }
  .tool.txt { width: auto; padding: 0 10px !important; font-size: 14px; }
  .sw { width: 26px; height: 26px; border-radius: 50%; background: var(--c); border: 2px solid var(--bg-3); }
  .sw.on { border-color: var(--pop); transform: scale(1.12); }
  .picker { position: relative; width: 30px; height: 30px; border-radius: 50%; overflow: hidden; border: 2px solid var(--bg-3);
    background: conic-gradient(#e63946, #f2c94c, #7ed957, #3a86ff, #8338ec, #f15bb5, #e63946); }
  .picker.on { border-color: var(--pop); }
  .picker input { position: absolute; inset: -6px; width: 44px; height: 44px; opacity: 0; cursor: pointer; border: 0; padding: 0; }
  .sz { width: 34px; height: 30px; border-radius: 10px; background: var(--bg-2); display: grid; place-items: center; border: 2px solid transparent; }
  .sz i { display: block; width: var(--d); height: var(--d); border-radius: 50%; background: var(--text); }
  .sz.on { border-color: var(--pop); }
  .cur { width: 26px; height: 26px; border-radius: 8px; background: var(--c); border: 2px solid var(--text); }

  /* ---------- end ---------- */
  #end { justify-content: center; text-align: center; gap: 18px; overflow-y: auto; }
  #endTitle { font-size: clamp(36px, 11vw, 54px); font-weight: 700; margin: 0; line-height: 1.02; text-wrap: balance; }
  #rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; text-align: left; }
  #rank li { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; background: var(--bg-2); border-radius: 14px; padding: 10px 14px; border: 2px solid transparent; }
  #rank li.me { border-color: var(--c); }
  #rank .pos { color: var(--muted); font-variant-numeric: tabular-nums; }
  #rank .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #rank .sc { font-size: 24px; font-weight: 700; color: var(--c); font-variant-numeric: tabular-nums; }
  #rank li:first-child .sc { font-size: 30px; }
  #endNote { margin: 0; color: var(--muted); }

  /* Picture check sheet (?sheet) */
  #sheet { position: fixed; inset: 0; overflow: auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; background: var(--bg); }
  #sheet figure { margin: 0; text-align: center; font-size: 14px; }
  #sheet canvas { width: 100%; height: auto; border-radius: 12px; background: var(--paper); }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main id="app">

  <section id="lobby" class="screen">
    <h1>Doodle<br><span>Duel</span></h1>
    <p class="tag">Guess the robot's sketches, or take turns drawing for each other. Faster guesses score more.</p>
    <div class="field">
      <label for="name">Your name</label>
      <input id="name" maxlength="12" autocomplete="off" placeholder="Type your name">
    </div>
    <div id="hostBox" hidden>
      <div id="qr"></div>
      <p id="codeLine">Room <b id="code"></b></p>
      <button id="share" class="ghost" type="button">Send the link instead</button>
    </div>
    <div id="setBox" hidden>
      <span class="label">Game mode</span>
      <div class="seg">
        <button type="button" id="modeRobot" class="on">Robot draws<small>Guess real sketches, fast</small></button>
        <button type="button" id="modeDraw">You draw<small>Take turns drawing</small></button>
      </div>
      <div class="optrow" id="optPics"><span>Pictures</span><div class="pills" data-opt="pics"><button type="button" data-v="10">10</button><button type="button" data-v="20">20</button><button type="button" data-v="30">30</button></div></div>
      <div class="optrow" id="optRounds"><span>Rounds</span><div class="pills" data-opt="rounds"><button type="button" data-v="2">2</button><button type="button" data-v="3">3</button><button type="button" data-v="4">4</button><button type="button" data-v="5">5</button></div></div>
      <div class="optrow" id="optTime"><span>Draw time</span><div class="pills" data-opt="drawTime"><button type="button" data-v="60">60s</button><button type="button" data-v="80">80s</button><button type="button" data-v="100">100s</button><button type="button" data-v="120">120s</button></div></div>
      <label class="check"><input type="checkbox" id="hostPlays"><span>This screen plays too<small>Leave off to use this screen as the shared board</small></span></label>
    </div>
    <p id="modeNote" hidden></p>
    <div id="whoBox" hidden>
      <span class="label" id="whoLabel">Players</span>
      <div class="chips" id="who"></div>
    </div>
    <p id="status" role="status">Setting up…</p>
    <button id="start" type="button" disabled hidden>Start game</button>
    <button id="retry" type="button" hidden>Try again</button>
  </section>

  <section id="game" class="screen" hidden>
    <header class="gtop">
      <div class="clock" id="clock"><span id="clockNum">0</span></div>
      <div id="hint"></div>
      <div class="ginfo"><b id="roundNo"></b><span id="roomTag"></span></div>
    </header>
    <div class="gmain">
      <div class="side">
        <ol class="plist" id="plist"></ol>
        <div id="joinMini"><div id="qrMini"></div><span>Join: room <b id="codeMini"></b></span></div>
      </div>
      <div class="board" id="board">
        <canvas id="cv" width="300" height="300" aria-label="The drawing"></canvas>
        <div id="banner" hidden><div class="word" id="bWord"></div><div class="who" id="bWho"></div></div>
        <div id="count" hidden></div>
        <div id="choose" hidden><p id="chooseTitle"></p><div id="chooseBtns"></div></div>
      </div>
      <div class="chat"><div id="feed" aria-live="polite"></div></div>
    </div>
    <div id="tools" hidden></div>
    <form id="guessForm" autocomplete="off">
      <input id="guess" placeholder="Type your guess" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" maxlength="30" aria-label="Your guess">
      <button type="submit">Guess</button>
    </form>
  </section>

  <section id="end" class="screen" hidden>
    <p id="endTitle"></p>
    <ol id="rank"></ol>
    <p id="endNote"></p>
    <button id="again" type="button" hidden>Back to the lobby</button>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(() => {
  'use strict';

  // ---------- settings ----------
  const ROBOT_MS = 14000;      // robot mode: time to guess each picture
  const ROBOT_DRAW_MS = 4000;  // robot mode: the robot finishes each sketch in 4 seconds
  const CHOOSE_MS = 15000;     // draw mode: time to pick a word
  const REVEAL_MS = 4000;      // pause on the answer
  const DRAWER_PER_GUESS = 50; // draw mode: the artist earns this for each correct guesser
  const PREFIX = 'doodleduel-v5-';
  // Supabase Realtime relays messages between phones (publishable key: safe to ship in the page).
  const SB_URL = 'https://popmeskdinlnlikzylyt.supabase.co';
  const SB_KEY = 'sb_publishable_7LN22XE2uyl7vjv_nKglow_Uw6-rTWN';
  const COLORS = ['#3ddbd9', '#ff6f9c', '#ffd23f', '#a99bff', '#7ee081', '#ff9f45', '#5cb8ff', '#f78fe0', '#c3f73a', '#ff8a8a', '#9be7ff', '#e0b0ff'];

  // ---------- drawing helpers (100 x 100 grid, y goes down) ----------
  const P = (...n) => { const o = []; for (let i = 0; i < n.length; i += 2) o.push([n[i], n[i + 1]]); return o; };
  const A = (cx, cy, rx, ry = rx, a0 = 0, a1 = 360) => {
    const n = Math.max(8, Math.ceil(Math.abs(a1 - a0) / 12)), o = [];
    for (let i = 0; i <= n; i++) { const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180; o.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]); }
    return o;
  };
  const B = (x0, y0, x1, y1, x2, y2, x3, y3) => Array.from({ length: 17 }, (_, i) => {
    const t = i / 16, u = 1 - t;
    return [u * u * u * x0 + 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t * x3, u * u * u * y0 + 3 * u * u * t * y1 + 3 * u * t * t * y2 + t * t * t * y3];
  });
  const SP = (cx, cy, r, turns, a0 = 90) => {
    const n = Math.ceil(turns * 30);
    return Array.from({ length: n + 1 }, (_, i) => {
      const t = i / n, a = (a0 + t * turns * 360) * Math.PI / 180, rr = r * (1 - t * 0.9);
      return [cx + rr * Math.cos(a), cy + rr * Math.sin(a)];
    });
  };
  const rays = (cx, cy, r0, r1, n, off = 0) => Array.from({ length: n }, (_, i) => {
    const a = (off + 360 * i / n) * Math.PI / 180;
    return [[cx + r0 * Math.cos(a), cy + r0 * Math.sin(a)], [cx + r1 * Math.cos(a), cy + r1 * Math.sin(a)]];
  });
  const MX = (...strokes) => strokes.flatMap(s => [s, s.map(([x, y]) => [100 - x, y])]);   // stroke + its mirror

  function windmillBlades() {
    const out = [];
    for (const deg of [35, 125, 215, 305]) {
      const a = deg * Math.PI / 180, ux = Math.cos(a), uy = Math.sin(a), px = -uy, py = ux;
      const at = (d, w) => [50 + ux * d + px * w, 38 + uy * d + py * w];
      out.push([at(3, 0), at(36, 0)]);
      out.push([at(12, 0), at(12, 8), at(36, 8), at(36, 0)]);
    }
    return out;
  }
  function ferrisCars() {
    return Array.from({ length: 8 }, (_, i) => {

  // ---------- making every robot round hard ----------
  // Random mirror and tilt, shuffled stroke order, some lines left out, shaky pen.
  // Left-out lines are drawn in pink when the answer is revealed.
  const len = s => s.reduce((t, p, i) => i ? t + Math.hypot(p[0] - s[i - 1][0], p[1] - s[i - 1][1]) : 0, 0);
  function prep(pic, seed, kind = 'hand') {
    let h = (seed * 2654435761 + 1013904223) >>> 0 || 1;
    const rnd = () => { h ^= h << 13; h >>>= 0; h ^= h >>> 17; h ^= h << 5; h >>>= 0; return h / 4294967296; };
    const maxTilt = kind === 'qd' ? 25 : 35;
    const flip = rnd() < 0.5, ang = (rnd() * 2 - 1) * maxTilt * Math.PI / 180, ca = Math.cos(ang), sa = Math.sin(ang);
    let raw = pic.s.filter(s => s.length).map(s => s.map(([x, y]) => {
      if (flip) x = 100 - x;
      const dx = x - 50, dy = y - 50;
      return [50 + dx * ca - dy * sa, 50 + dx * sa + dy * ca];
    }));
    const all = raw.flat(), xs = all.map(p => p[0]), ys = all.map(p => p[1]);
    const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
    const k = 86 / Math.max(maxX - minX, maxY - minY, 1), cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    raw = raw.map(s => s.map(([x, y]) => [50 + (x - cx) * k, 50 + (y - cy) * k]));
    raw = raw.map(s => rnd() < 0.5 ? s.slice().reverse() : s);
    const longest = raw.reduce((b, s, i) => len(s) > len(raw[b]) ? i : b, 0);
    const rate = kind === 'qd' ? (raw.length >= 5 ? 0.15 + rnd() * 0.1 : 0) : (raw.length >= 4 ? 0.25 + rnd() * 0.15 : 0);
    const dropN = Math.floor(raw.length * rate);
    const dropIdx = new Set(raw.map((_, i) => i).filter(i => i !== longest).sort(() => rnd() - 0.5).slice(0, dropN));
    const order = raw.map((s, i) => ({ s, hidden: dropIdx.has(i) }));
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    let total = 0;
    const strokes = order.map(({ s: src, hidden }) => {
      const pts = [src[0]];
      for (let i = 1; i < src.length; i++) {
        const [x0, y0] = src[i - 1], [x1, y1] = src[i];
        const n = Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0) / 3));
        for (let q = 1; q <= n; q++) {

          pts.push([x0 + (x1 - x0) * f + (last ? 0 : (rnd() - .5) * 1.2), y0 + (y1 - y0) * f + (last ? 0 : (rnd() - .5) * 1.2)]);

      const seg = [0];
      let l = 0;
      for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); l += d; }

      return { pts, seg, hidden };

    el.cv.style.width = el.cv.style.height = size + 'px';
    if (el.cv.width !== Math.round(size * dpr)) { el.cv.width = el.cv.height = Math.round(size * dpr); }
    if (mode === 'draw' && phase !== 'countdown') renderInk();
    else if (cur && phase === 'reveal') draw(1, true);
  }
  new ResizeObserver(() => { if (!el.game.hidden) sizeCanvas(); }).observe(el.board);

  function drawPic(c2, pic, p, reveal) {
    const s = c2.canvas.width, k = s / 100;
    c2.clearRect(0, 0, s, s);
    if (!pic) return;
    c2.lineWidth = s * 0.014; c2.lineCap = 'round'; c2.lineJoin = 'round';
    if (reveal) {
      c2.strokeStyle = '#ff6f9c'; c2.setLineDash([s * 0.02, s * 0.02]);
      for (const st of pic.strokes) if (st.hidden) { c2.beginPath(); st.pts.forEach(([x, y], i) => i ? c2.lineTo(x * k, y * k) : c2.moveTo(x * k, y * k)); c2.stroke(); }
      c2.setLineDash([]);
    }
    c2.strokeStyle = '#1f1d36';
    let left = pic.total * p, tip = null;
    for (const st of pic.strokes) {
      if (st.hidden) continue;
      if (left <= 0) break;
      c2.beginPath();
      c2.moveTo(st.pts[0][0] * k, st.pts[0][1] * k);
      for (let i = 1; i < st.pts.length; i++) {
        const d = st.seg[i];
        if (left >= d) { c2.lineTo(st.pts[i][0] * k, st.pts[i][1] * k); left -= d; tip = st.pts[i]; }
        else {
          const f = left / d, a = st.pts[i - 1], b = st.pts[i];
          tip = [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
          c2.lineTo(tip[0] * k, tip[1] * k); left = 0; break;
        }
      }
      c2.stroke();
    }
    if (p < 1 && tip) { c2.fillStyle = '#ff6f9c'; c2.beginPath(); c2.arc(tip[0] * k, tip[1] * k, s * 0.016, 0, Math.PI * 2); c2.fill(); }
  }
  const draw = (p, reveal) => drawPic(ctx, cur, p, reveal);

  // ---------- go ----------
  async function loadSketches() {
    try { const r = await fetch('drawings.json', { cache: 'force-cache' }); if (r.ok) { QD = await r.json(); KNOWN = null; } } catch (e) { QD = null; }
  }
  if (params.has('sheet')) {           // check sheet: the hand-made pictures, then a sample of real sketches
    document.getElementById('app').hidden = true;
    const grid = document.createElement('div'); grid.id = 'sheet';
    const add = (label, pic) => { const f = document.createElement('figure'), c = document.createElement('canvas'); c.width = c.height = 300; f.append(c, Object.assign(document.createElement('figcaption'), { textContent: label })); grid.append(f); drawPic(c.getContext('2d'), pic, 1, true); };
    PICTURES.forEach((pic, i) => add((i + 1) + '. ' + pic.names[0], prep(pic, i + 7, 'hand')));
    document.body.append(grid);
    loadSketches().then(() => { if (QD) for (let i = 0; i < 40; i++) { const c = Math.floor(Math.random() * QD.names.length); add(QD.names[c], prep({ names: [], s: decodeQD(QD.d[c][0]) }, i + 3, 'qd')); } });
  } else if (typeof supabase === 'undefined' || typeof QRCode === 'undefined') {
    setStatus('The game couldn\'t load. Check your internet and try again.', 'bad'); el.retry.hidden = false;
  } else if (isHost) {
    code = Array.from({ length: 4 }, () => 'abcdefghjkmnpqrstuvwxyz'[Math.floor(Math.random() * 23)]).join('');
    setStatus('Setting up…');
    paintSettings();
    loadSketches();
    connect();
  } else {
    setStatus('Joining the game…');
    connect();
  }

  window.__dd = { PICTURES, WORDS, isMatch, isClose, prep, get QD() { return QD; }, get state() { return { phase, mode, turn, total, roundNo, rounds, scores, isHost, myId, drawer, gots, answer: word || null, mask, options, ink: ink.length, online: Object.keys(online).length, players: activePlayers().length }; } };
})();
</script>
