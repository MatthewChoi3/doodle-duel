<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1d1b3a">
<title>Doodle Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
  /* Layout: one fixed full-screen column per screen; the sketch pad takes all spare height. */
  :root {
    --bg: #1d1b3a;
    --bg-2: #2a2752;
    --paper: #fffdf6;
    --ink: #1f1d36;
    --text: #f4f1ff;
    --muted: #a9a4d4;
    --pop: #ffd23f;
    --bad: #ff6f9c;
    --good: #3ddbd9;
    --font: "Fredoka", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
  body { overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }

  #app {
    position: fixed; left: 0; top: 0; width: 100%;
    height: var(--vvh, 100dvh);
    padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    display: flex; justify-content: center;
  }
  .screen { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }

  h1 { margin: 0; font-size: clamp(40px, 13vw, 60px); line-height: .92; font-weight: 700; letter-spacing: -.01em; }
  h1 span { color: var(--pop); }
  .tag { margin: 0; color: var(--muted); font-size: 17px; }

  label, .label { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  input {
    font: inherit; font-size: 18px; width: 100%; min-width: 0;
    padding: 12px 14px; border-radius: 14px; border: 2px solid transparent;
    background: var(--bg-2); color: var(--text); outline: none;
  }
  input:focus { border-color: var(--pop); }
  input::placeholder { color: var(--muted); }

  button {
    font: inherit; font-weight: 600; font-size: 19px; cursor: pointer;
    padding: 14px 18px; border: 0; border-radius: 16px;
    background: var(--pop); color: var(--ink);
    box-shadow: 0 4px 0 #c79a0e; transition: transform .06s, box-shadow .06s;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #c79a0e; }
  button:disabled { background: var(--bg-2); color: var(--muted); box-shadow: none; cursor: default; transform: none; }
  button.ghost { background: transparent; color: var(--text); box-shadow: none; border: 2px solid var(--bg-2); font-size: 16px; padding: 10px 14px; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--pop); outline-offset: 2px; }

  /* Lobby: scrolls on short screens; auto margins centre it without clipping the top. */
  #lobby { overflow-y: auto; }
  #lobby > :first-child { margin-top: auto; }
  #lobby > :last-child { margin-bottom: auto; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  #hostBox { display: flex; flex-direction: column; align-items: center; gap: 10px; background: var(--bg-2); border-radius: 22px; padding: 16px; }
  #qr { background: #fff; padding: 10px; border-radius: 14px; line-height: 0; min-height: 190px; min-width: 190px; }
  #qr img, #qr canvas { width: 170px; height: 170px; }
  #codeLine { margin: 0; color: var(--muted); }
  #codeLine b { color: var(--text); letter-spacing: .2em; font-size: 20px; }
  #status { margin: 0; min-height: 1.4em; font-size: 17px; text-align: center; }
  #status.ok { color: var(--good); }
  #status.bad { color: var(--bad); }
  #whoBox { display: flex; flex-direction: column; gap: 6px; }

  /* Player chips (lobby list and in-game scoreboard) */
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chips.scroll::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 11px 5px 8px; border-radius: 999px; background: var(--bg-2);
    border: 2px solid transparent; font-size: 15px; white-space: nowrap;
  }
  .chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
  .chip b { font-variant-numeric: tabular-nums; color: var(--c); }
  .chip.me { border-color: var(--c); }
  .chip.off { opacity: .45; }
  .chip.bump b { animation: bump .5s; }
  @keyframes bump { 40% { transform: scale(1.6); } }

  /* Game */
  .hudtop { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .timer { height: 8px; border-radius: 8px; background: var(--bg-2); overflow: hidden; flex: none; }
  .timer i { display: block; height: 100%; width: 100%; background: var(--pop); transform-origin: left; }
  .timer.low i { background: var(--bad); }

  .board { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; }
  canvas { background: var(--paper); border-radius: 20px; box-shadow: 0 6px 0 rgba(0,0,0,.25); display: block; }
  #banner, #count {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none;
  }
  #banner { justify-content: flex-end; padding-bottom: 6%; }
  #banner .word { background: var(--ink); color: var(--pop); font-size: clamp(24px, 8vw, 38px); font-weight: 700; padding: 6px 18px; border-radius: 14px; text-transform: capitalize; }
  #banner .who { margin-top: 6px; background: var(--ink); color: var(--c, var(--text)); padding: 4px 12px; border-radius: 10px; font-size: 16px; }
  #count { font-size: 120px; font-weight: 700; color: var(--pop); text-shadow: 0 6px 0 rgba(0,0,0,.3); }

  #feed { height: 22px; flex: none; font-size: 15px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  #guessForm { display: flex; gap: 8px; flex: none; }
  #guessForm input { flex: 1; background: var(--paper); color: var(--ink); }
  #guessForm input::placeholder { color: #8d89a8; }
  #guessForm input:disabled { opacity: .55; }
  #guessForm button { flex: none; }
  .shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }

  /* End */
  #end { justify-content: center; text-align: center; gap: 18px; overflow-y: auto; }
  #endTitle { font-size: clamp(36px, 11vw, 54px); font-weight: 700; margin: 0; line-height: 1.02; text-wrap: balance; }
  #rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; text-align: left; }
  #rank li { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; background: var(--bg-2); border-radius: 14px; padding: 10px 14px; border: 2px solid transparent; }
  #rank li.me { border-color: var(--c); }
  #rank .pos { color: var(--muted); font-variant-numeric: tabular-nums; }
  #rank .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #rank .sc { font-size: 26px; font-weight: 700; color: var(--c); font-variant-numeric: tabular-nums; }
  #rank li:first-child .sc { font-size: 32px; }
  #endNote { margin: 0; color: var(--muted); }

  /* Picture check sheet (?sheet) */
  #sheet { position: fixed; inset: 0; overflow: auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; background: var(--bg); }
  #sheet figure { margin: 0; text-align: center; font-size: 14px; }
  #sheet canvas { width: 100%; height: auto; border-radius: 12px; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main id="app">

  <section id="lobby" class="screen">
    <h1>Doodle<br><span>Duel</span></h1>
    <p class="tag">The robot sketches 20 tough pictures in seconds. First to guess each one gets the point.</p>
    <div class="field">
      <label for="name">Your name</label>
      <input id="name" maxlength="12" autocomplete="off" placeholder="Type your name">
    </div>
    <div id="hostBox" hidden>
      <div id="qr"></div>
      <p id="codeLine">Room <b id="code"></b></p>
      <button id="share" class="ghost" type="button">Send the link instead</button>
    </div>
    <div id="whoBox" hidden>
      <span class="label" id="whoLabel">Players</span>
      <div class="chips" id="who"></div>
    </div>
    <p id="status" role="status">Setting up…</p>
    <button id="start" type="button" disabled hidden>Start game</button>
    <button id="retry" type="button" hidden>Try again</button>
  </section>

  <section id="game" class="screen" hidden>
    <div class="hudtop"><span id="roundNo">1 / 20</span><span id="roomTag"></span></div>
    <div class="chips scroll" id="board-chips"></div>
    <div class="timer" id="timer"><i id="bar"></i></div>
    <div class="board" id="board">
      <canvas id="cv" width="300" height="300" aria-label="The picture being drawn"></canvas>
      <div id="banner" hidden><div class="word" id="bWord"></div><div class="who" id="bWho"></div></div>
      <div id="count" hidden></div>
    </div>
    <div id="feed" aria-live="polite"></div>
    <form id="guessForm" autocomplete="off">
      <input id="guess" placeholder="What is it?" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" maxlength="24" aria-label="Your guess">
      <button type="submit">Guess</button>
    </form>
  </section>

  <section id="end" class="screen" hidden>
    <p id="endTitle"></p>
    <ol id="rank"></ol>
    <p id="endNote"></p>
    <button id="again" type="button" hidden>Play again</button>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(() => {
  'use strict';

  // ---------- settings ----------
  const TOTAL = 20;          // pictures per game
  const ROUND_MS = 12000;    // time to guess each picture
  const DRAW_MS = 6000;      // the robot finishes each drawing in 6 seconds
  const REVEAL_MS = 3000;    // pause on the answer
  const PREFIX = 'doodleduel-v3-';

  const COLORS = ['#3ddbd9', '#ff6f9c', '#ffd23f', '#a99bff', '#7ee081', '#ff9f45', '#5cb8ff', '#f78fe0'];

  // ---------- drawing helpers (100 x 100 grid, y goes down) ----------
  const P = (...n) => { const o = []; for (let i = 0; i < n.length; i += 2) o.push([n[i], n[i + 1]]); return o; };
  const A = (cx, cy, rx, ry = rx, a0 = 0, a1 = 360) => {
    const n = Math.max(8, Math.ceil(Math.abs(a1 - a0) / 12)), o = [];
    for (let i = 0; i <= n; i++) { const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180; o.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]); }
    return o;
  };
  const B = (x0, y0, x1, y1, x2, y2, x3, y3) => Array.from({ length: 17 }, (_, i) => {
    const t = i / 16, u = 1 - t;
    return [u * u * u * x0 + 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t * x3, u * u * u * y0 + 3 * u * u * t * y1 + 3 * u * t * t * y2 + t * t * t * y3];
  });
  const SP = (cx, cy, r, turns, a0 = 90) => {
    const n = Math.ceil(turns * 30);
    return Array.from({ length: n + 1 }, (_, i) => {
      const t = i / n, a = (a0 + t * turns * 360) * Math.PI / 180, rr = r * (1 - t * 0.9);
      return [cx + rr * Math.cos(a), cy + rr * Math.sin(a)];
    });
  };
  const rays = (cx, cy, r0, r1, n, off = 0) => Array.from({ length: n }, (_, i) => {
    const a = (off + 360 * i / n) * Math.PI / 180;
    return [[cx + r0 * Math.cos(a), cy + r0 * Math.sin(a)], [cx + r1 * Math.cos(a), cy + r1 * Math.sin(a)]];
  });
  const MX = (...strokes) => strokes.flatMap(s => [s, s.map(([x, y]) => [100 - x, y])]);   // stroke + its mirror

  function windmillBlades() {
    const out = [];
    for (const deg of [35, 125, 215, 305]) {
      const a = deg * Math.PI / 180, ux = Math.cos(a), uy = Math.sin(a), px = -uy, py = ux;
      const at = (d, w) => [50 + ux * d + px * w, 38 + uy * d + py * w];
      out.push([at(3, 0), at(36, 0)]);
      out.push([at(12, 0), at(12, 8), at(36, 8), at(36, 0)]);
    }
    return out;
  }
  function ferrisCars() {
    return Array.from({ length: 8 }, (_, i) => {
      const a = (i * 45) * Math.PI / 180, x = 50 + 30 * Math.cos(a), y = 40 + 30 * Math.sin(a);
      return P(x - 3.5, y + 1, x + 3.5, y + 1, x + 3.5, y + 7, x - 3.5, y + 7, x - 3.5, y + 1);

  const AR = (cx, cy, rx, ry, rot) => {      // rotated ellipse

  // Shuffle stroke order, flip some strokes, subdivide and wobble: the same picture never draws the same way twice.
  function prep(pic, seed) {
    let h = (seed * 2654435761 + 1013904223) >>> 0 || 1;
    const rnd = () => { h ^= h << 13; h >>>= 0; h ^= h >>> 17; h ^= h << 5; h >>>= 0; return h / 4294967296; };
    const raw = pic.s.map(s => rnd() < 0.5 ? s.slice().reverse() : s);
    for (let i = raw.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [raw[i], raw[j]] = [raw[j], raw[i]]; }
    let total = 0;
    const strokes = raw.map(src => {
      const pts = [src[0]];
      for (let i = 1; i < src.length; i++) {
        const [x0, y0] = src[i - 1], [x1, y1] = src[i];
        const n = Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0) / 3));
        for (let k = 1; k <= n; k++) {
          const f = k / n, last = (k === n);
          pts.push([x0 + (x1 - x0) * f + (last ? 0 : (rnd() - .5) * .7), y0 + (y1 - y0) * f + (last ? 0 : (rnd() - .5) * .7)]);
        }
      }
      const seg = [0];
      for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); total += d; }
      return { pts, seg };
    });
    return { names: pic.names, strokes, total };
  }

  // ---------- guess checking ----------
  const norm = s => s.toLowerCase().replace(/[^a-z ]/g, '').replace(/\s+/g, ' ').trim();
  function lev(a, b) {
    if (Math.abs(a.length - b.length) > 1) return 2;
    let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = cur;
    }
    return prev[b.length];
  }
  function isMatch(guess, names) {
    const g = norm(guess).replace(/^(a|an|the) /, '');
    if (!g) return false;
    const joined = g.replace(/ /g, ''), words = g.split(' ');
    return names.some(n => {
      const nj = n.replace(/ /g, '');
      if (joined === nj || joined === nj + 's' || joined + 's' === nj) return true;
      if (words.includes(nj)) return true;
      return nj.length >= 5 && lev(joined, nj) <= 1;
    });
  }

    const url = joinUrl();
    try {
      if (navigator.share) await navigator.share({ title: 'Doodle Duel', text: 'Play Doodle Duel with me', url });
      else { await navigator.clipboard.writeText(url); el.share.textContent = 'Link copied'; setTimeout(() => el.share.textContent = 'Send the link instead', 1800); }
    } catch (e) {}
  });

  // ---------- players and scores ----------
  function chip(id, score, bump) {
    const c = document.createElement('span');
    c.className = 'chip' + (id === myId ? ' me' : '') + (online[id] || id === myId ? '' : ' off') + (bump ? ' bump' : '');
    c.style.setProperty('--c', colorOf(id));
    const dot = document.createElement('i');
    const nm = document.createElement('span'); nm.textContent = nameOf(id) + (id === myId ? ' (you)' : '');
    c.append(dot, nm);
    if (score !== undefined) { const b = document.createElement('b'); b.textContent = score; c.append(b); }
    return c;
  }
  function ranked() {
    const ids = new Set([...Object.keys(scores), ...Object.keys(online), myId]);
    return [...ids].sort((a, b) => (scores[b] || 0) - (scores[a] || 0) || nameOf(a).localeCompare(nameOf(b)));
  }
  function paintPlayers(bumpId) {
    if (phase === 'lobby') {
      const ids = [myId, ...others()];
      el.whoBox.hidden = ids.length < 2 && role === 'host';
      el.whoLabel.textContent = 'In the room (' + ids.length + ')';
      el.who.replaceChildren(...ids.map(id => chip(id)));
    } else {
      el.chips.replaceChildren(...ranked().map(id => chip(id, scores[id] || 0, id === bumpId)));
    }
  }

  // ---------- messages ----------
  function onData(m) {
    if (!m || typeof m !== 'object') return;
    if (m.names) Object.assign(names, m.names);
    switch (m.t) {
      case 'miss': if (phase === 'round' && m.id !== myId) feed(nameOf(m.id) + ': ' + String(m.text || '').slice(0, 24) + ' ✗'); break;
      // host only
      case 'hello': if (role === 'host' && phase !== 'lobby') { if (!(m.id in scores)) scores[m.id] = 0; sendSync(); } break;
      case 'correct': if (role === 'host' && phase === 'round' && m.i === roundI && typeof m.id === 'string') endRound(m.id); break;
      // guests only
      case 'start': if (role === 'guest') { scores = m.scores || {}; countdown(); } break;
      case 'round': if (role === 'guest') beginRound(m.i, m.d, m.s); break;
      case 'result': if (role === 'guest') { if (m.i !== roundI || curD !== m.d || phase === 'lobby') beginRound(m.i, m.d, m.s); showResult(m); } break;
      case 'end': if (role === 'guest') { scores = m.scores; showEnd(); } break;
      case 'sync': if (role === 'guest') applySync(m); break;
    }
  }

  // ---------- game flow ----------
  function stopTimers() { clearTimeout(roundTimer); clearTimeout(nextTimer); clearTimeout(countTimer); clearTimeout(claimTimer); cancelAnimationFrame(raf); }

  async function keepAwake() {
    try { if (navigator.wakeLock && document.visibilityState === 'visible' && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => { if (phase !== 'lobby' && phase !== 'end') keepAwake(); });

  el.start.addEventListener('click', startGame);
  el.again.addEventListener('click', startGame);

  function knownNames() { const o = {}; for (const id of ranked()) o[id] = nameOf(id); return o; }

  function startGame() {            // host
    if (!others().length) return;
    order = PICTURES.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    order = order.slice(0, TOTAL);
    seeds = order.map(() => Math.floor(Math.random() * 1e9));
    scores = {};
    for (const id of [myId, ...others()]) scores[id] = 0;
    send({ t: 'start', scores, names: knownNames() });
    countdown(() => startRound(0));
  }

  function sendSync() {             // host: tell a (re)joining player where the game is
    send({ t: 'sync', phase, i: roundI, d: order[roundI], s: seeds[roundI], elapsed: performance.now() - t0, scores, winner: lastWinner, names: knownNames() });
  }
  function applySync(m) {           // guest
    scores = m.scores || {};
    if (m.phase === 'end') { showEnd(); return; }
    if (m.phase === 'countdown') { if (phase !== 'countdown') countdown(); return; }
    if (m.i !== roundI || curD !== m.d || phase === 'lobby' || phase === 'end' || phase === 'countdown') beginRound(m.i, m.d, m.s, m.elapsed);
    if (m.phase === 'reveal') showResult({ winner: m.winner, scores: m.scores });
    else paintPlayers();
  }

  function countdown(done) {
    stopTimers();
    phase = 'countdown';
    show('game');
    keepAwake();
    paintPlayers();
    el.roundNo.textContent = 'Get ready';
    el.roomTag.textContent = 'Room ' + code.toUpperCase();
    el.banner.hidden = true; feed('');
    el.guess.disabled = true; el.guess.value = '';
    el.bar.style.transform = 'scaleX(1)'; el.timer.classList.remove('low');
    cur = null; curD = -1;
    ctx.clearRect(0, 0, el.cv.width, el.cv.height);
    let n = 3;
    el.count.hidden = false; el.count.textContent = n;
    const tick = () => {
      n--;
      if (n > 0) { el.count.textContent = n; countTimer = setTimeout(tick, 1000); }
      else { el.count.hidden = true; if (done) done(); }
    };
    countTimer = setTimeout(tick, 1000);
  }

  function startRound(i) {          // host
    lastWinner = null;
    send({ t: 'round', i, d: order[i], s: seeds[i] });
    beginRound(i, order[i], seeds[i]);
    roundTimer = setTimeout(() => endRound(null), ROUND_MS);
  }

  function beginRound(i, d, s, elapsed = 0) {
    clearTimeout(countTimer); clearTimeout(claimTimer); cancelAnimationFrame(raf);
    if (!PICTURES[d]) return;
    phase = 'round'; roundI = i; curD = d; curS = s; cur = prep(PICTURES[d], s || 1); waiting = false;
    t0 = performance.now() - Math.max(0, Math.min(ROUND_MS, elapsed || 0));
    show('game');
    el.count.hidden = true; el.banner.hidden = true;
    el.roundNo.textContent = 'Picture ' + (i + 1) + ' of ' + TOTAL;
    el.roomTag.textContent = 'Room ' + code.toUpperCase();
    feed('');
    el.guess.disabled = false; el.guess.value = '';
    el.guess.focus({ preventScroll: true });
    paintPlayers();
    frame();
  }

  function frame() {
    if (phase !== 'round') return;
    const t = performance.now() - t0, left = 1 - t / ROUND_MS;
    draw(Math.min(1, t / DRAW_MS));
    el.bar.style.transform = 'scaleX(' + Math.max(0, left) + ')';
    el.timer.classList.toggle('low', left < 0.25);
    raf = requestAnimationFrame(frame);
  }

  function endRound(winner) {       // host
    if (phase !== 'round') return;
    clearTimeout(roundTimer);
    if (winner) scores[winner] = (scores[winner] || 0) + 1;
    lastWinner = winner;
    const m = { t: 'result', i: roundI, d: order[roundI], s: seeds[roundI], winner, scores, names: winner ? { [winner]: nameOf(winner) } : undefined };
    send(m);
    showResult(m);
    nextTimer = setTimeout(() => {
      if (roundI + 1 < TOTAL) startRound(roundI + 1);
      else { phase = 'end'; send({ t: 'end', scores, names: knownNames() }); showEnd(); }
    }, REVEAL_MS);
  }

  function showResult(m) {
    phase = 'reveal';
    cancelAnimationFrame(raf); clearTimeout(claimTimer);
    scores = m.scores || scores;
    draw(1);
    el.guess.disabled = true; el.guess.value = '';
    el.bWord.textContent = cur ? cur.names[0] : '';
    el.bWho.style.setProperty('--c', m.winner ? colorOf(m.winner) : 'var(--muted)');
    el.bWho.textContent = m.winner === myId ? 'You got it!' : m.winner ? nameOf(m.winner) + ' got it' : 'Nobody got it';
    el.banner.hidden = false;
    el.timer.classList.remove('low');
    paintPlayers(m.winner);
  }

  function showEnd() {
    stopTimers();
    phase = 'end';
    const ids = ranked(), top = scores[ids[0]] || 0;
    const winners = ids.filter(id => (scores[id] || 0) === top);
    el.endTitle.textContent = top === 0 ? 'Nobody scored!'
      : winners.length > 1 ? (winners.includes(myId) ? 'You tied for first!' : 'It\'s a tie!')
      : winners[0] === myId ? 'You win!' : nameOf(winners[0]) + ' wins!';
    let pos = 0, prev = null;
    el.rank.replaceChildren(...ids.map((id, k) => {
      const sc = scores[id] || 0;
      if (sc !== prev) { pos = k + 1; prev = sc; }
      const li = document.createElement('li');
      li.className = id === myId ? 'me' : '';
      li.style.setProperty('--c', colorOf(id));
      const a = document.createElement('span'); a.className = 'pos'; a.textContent = pos + '.';
      const b = document.createElement('span'); b.className = 'nm'; b.textContent = nameOf(id) + (id === myId ? ' (you)' : '');
      const c = document.createElement('span'); c.className = 'sc'; c.textContent = sc;
      li.append(a, b, c);
      return li;
    }));
    el.again.hidden = role !== 'host';
    el.endNote.textContent = role === 'host' ? 'Same players, new pictures?' : 'Waiting for the host to start a rematch.';
    show('end');
  }

  // A correct guess from a guest is re-sent until the host answers, in case a message drops.
  function claim() {
    if (!waiting || phase !== 'round' || claimTries >= 5) return;
    claimTries++;
    send({ t: 'correct', i: roundI, id: myId });
    claimTimer = setTimeout(claim, 1200);
  }

  el.form.addEventListener('submit', e => {
    e.preventDefault();
    const text = el.guess.value.trim();
    if (phase !== 'round' || waiting || !text || !cur) return;
    el.guess.value = '';
    if (isMatch(text, cur.names)) {
      if (role === 'host') endRound(myId);
      else { waiting = true; claimTries = 0; feed('Checking…'); claim(); }
    } else {
      feed('You: ' + text + ' ✗');
      send({ t: 'miss', id: myId, text });
      el.form.classList.remove('shake'); void el.form.offsetWidth; el.form.classList.add('shake');
    }
    el.guess.focus({ preventScroll: true });
  });

  // ---------- canvas ----------
  function sizeCanvas() {
    const r = el.board.getBoundingClientRect();
    const size = Math.max(120, Math.floor(Math.min(r.width, r.height)));
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    el.cv.style.width = el.cv.style.height = size + 'px';
    if (el.cv.width !== Math.round(size * dpr)) { el.cv.width = el.cv.height = Math.round(size * dpr); }
    if (cur && phase === 'reveal') draw(1);
  }
  new ResizeObserver(() => { if (!el.game.hidden) sizeCanvas(); }).observe(el.board);

  function drawPic(c2, pic, p) {
    const s = c2.canvas.width, k = s / 100;
    c2.clearRect(0, 0, s, s);
    if (!pic) return;
    c2.lineWidth = s * 0.014; c2.lineCap = 'round'; c2.lineJoin = 'round'; c2.strokeStyle = '#1f1d36';
    let left = pic.total * p, tip = null;
    for (const st of pic.strokes) {
      if (left <= 0) break;
      c2.beginPath();
      c2.moveTo(st.pts[0][0] * k, st.pts[0][1] * k);
      for (let i = 1; i < st.pts.length; i++) {
        const d = st.seg[i];
        if (left >= d) { c2.lineTo(st.pts[i][0] * k, st.pts[i][1] * k); left -= d; tip = st.pts[i]; }
        else {
          const f = left / d, a = st.pts[i - 1], b = st.pts[i];
          tip = [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
          c2.lineTo(tip[0] * k, tip[1] * k); left = 0; break;
        }
      }
      c2.stroke();
    }
    if (p < 1 && tip) { c2.fillStyle = '#ff6f9c'; c2.beginPath(); c2.arc(tip[0] * k, tip[1] * k, s * 0.016, 0, Math.PI * 2); c2.fill(); }
  }
  const draw = p => drawPic(ctx, cur, p);

  // ---------- go ----------
  if (params.has('sheet')) {           // picture check sheet for editing the drawings
    document.getElementById('app').hidden = true;
    const grid = document.createElement('div'); grid.id = 'sheet';
    PICTURES.forEach((pic, i) => {
      const f = document.createElement('figure'), c = document.createElement('canvas');
      c.width = c.height = 300; f.append(c, Object.assign(document.createElement('figcaption'), { textContent: (i + 1) + '. ' + pic.names[0] }));
      grid.append(f); drawPic(c.getContext('2d'), prep(pic, i + 7), 1);
    });
    document.body.append(grid);
  } else if (typeof supabase === 'undefined' || typeof QRCode === 'undefined') {
    setStatus('The game couldn\'t load. Check your internet and try again.', 'bad'); el.retry.hidden = false;
  } else if (role === 'host') {
    code = Array.from({ length: 4 }, () => 'abcdefghjkmnpqrstuvwxyz'[Math.floor(Math.random() * 23)]).join('');
    setStatus('Setting up…');
    connect();
  } else {
    setStatus('Joining the game…');
    connect();
  }

  window.__dd = { PICTURES, isMatch, prep, get state() { return { phase, roundI, scores, role, myId, answer: cur && cur.names[0], online: Object.keys(online).length }; } };
})();
</script>
</body>
</html>
